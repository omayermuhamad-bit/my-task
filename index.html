/* ---------------- local storage wrapper (works offline, on-device) ---------------- */
const STORAGE_PREFIX = "dlm_";
const storage = {
  get(key) {
    return new Promise((resolve, reject) => {
      try {
        const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
        if (raw === null) { reject(new Error("not found")); return; }
        resolve({ key, value: raw });
      } catch (e) { reject(e); }
    });
  },
  set(key, value) {
    return new Promise((resolve, reject) => {
      try { window.localStorage.setItem(STORAGE_PREFIX + key, value); resolve({ key, value }); }
      catch (e) { reject(e); }
    });
  },
  list(prefix) {
    return new Promise((resolve) => {
      try {
        const keys = [];
        const p = STORAGE_PREFIX + (prefix || "");
        for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.indexOf(p) === 0) keys.push(k.slice(STORAGE_PREFIX.length));
        }
        resolve({ keys });
      } catch (e) { resolve({ keys: [] }); }
    });
  },
};

/* ---------------- privacy-note encryption helpers (AES-256-GCM, key derived via Argon2id) ---------------- */
const pnCryptoAvailable = typeof window !== "undefined" && window.crypto && window.crypto.subtle;
function pnBufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function pnB64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }
function pnRandomSalt() { return pnBufToB64(window.crypto.getRandomValues(new Uint8Array(16))); }
// Argon2id: memory-hard KDF (64MB, 3 passes) — far more expensive to brute-force offline (e.g. on GPU clusters)
// than a plain PBKDF2 hash, which matters a lot given passphrases are short and backups can leave the device.
async function pnDeriveKeyArgon2(pin, saltB64) {
  const saltBytes = pnB64ToBuf(saltB64);
  const result = await window.argon2.hash({
    pass: pin,
    salt: saltBytes,
    time: 3,
    mem: 65536,
    hashLen: 32,
    parallelism: 1,
    type: window.argon2.ArgonType.Argon2id,
  });
  return window.crypto.subtle.importKey("raw", result.hash, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
// Legacy path, kept only so notes encrypted before the Argon2id upgrade can still be opened and re-encrypted.
async function pnDeriveKeyPBKDF2(pin, saltB64) {
  const enc = new TextEncoder();
  const salt = pnB64ToBuf(saltB64);
  const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return window.crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}
async function pnEncrypt(obj, pin, saltB64) {
  const key = await pnDeriveKeyArgon2(pin, saltB64);
  const iv = window.crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const data = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
  return { iv: pnBufToB64(iv), data: pnBufToB64(data), kdf: "argon2id" };
}
async function pnDecrypt(payload, pin, saltB64) {
  const key = payload.kdf === "argon2id" ? await pnDeriveKeyArgon2(pin, saltB64) : await pnDeriveKeyPBKDF2(pin, saltB64);
  const iv = pnB64ToBuf(payload.iv);
  const data = pnB64ToBuf(payload.data);
  const dec = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return JSON.parse(new TextDecoder().decode(dec));
}

// Kuwaiti algorithm (তুলনামূলক নির্ভুল, অফলাইনে কাজ করে, স্থানীয় চাঁদ দেখার সাথে ১-২ দিন পার্থক্য হতে পারে)
function gregorianToHijri(dateObj) {
  const jd = Math.floor((dateObj.getTime() / 86400000) + 2440588) + 1;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) + Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  const hMonth = Math.floor((24 * l) / 709);
  const hDay = l - Math.floor((709 * hMonth) / 24);
  const hYear = 30 * n + j - 30;
  return { day: hDay, month: hMonth, year: hYear };
}
function hijriDateLabel(dateObj, offsetDays) {
  const base = dateObj || new Date();
  const adjusted = new Date(base.getTime() + (parseInt(offsetDays) || 0) * 86400000);
  const h = gregorianToHijri(adjusted);
  const monthName = HIJRI_MONTHS_BN[Math.max(0, Math.min(11, h.month - 1))];
  return toBnNum(h.day) + " " + monthName + " " + toBnNum(h.year) + " হিজরি";
}
function toBnNum(n) {
  const bn = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
  return String(n).split("").map(c => (c >= "0" && c <= "9") ? bn[c] : c).join("");
}

/* ---------------- prayer time calculation (astronomical, MWL method: Fajr 18°, Isha 17°, Asr factor 1) ---------------- */
const DEG = Math.PI / 180;
function pFixAngle(a) { a = a - 360 * Math.floor(a / 360); return a < 0 ? a + 360 : a; }
function pFixHour(a) { a = a - 24 * Math.floor(a / 24); return a < 0 ? a + 24 : a; }
function pSin(d) { return Math.sin(d * DEG); }
function pCos(d) { return Math.cos(d * DEG); }
function pTan(d) { return Math.tan(d * DEG); }
function pArcsin(x) { return Math.asin(x) / DEG; }
function pArccos(x) { return Math.acos(Math.max(-1, Math.min(1, x))) / DEG; }
function pArctan2(y, x) { return Math.atan2(y, x) / DEG; }
function pArccot(x) { return Math.atan2(1, x) / DEG; }
function julianDate(year, month, day) {
  if (month <= 2) { year -= 1; month += 12; }
  const A = Math.floor(year / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
}
function sunPosition(jd) {
  const D = jd - 2451545.0;
  const g = pFixAngle(357.529 + 0.98560028 * D);
  const q = pFixAngle(280.459 + 0.98564736 * D);
  const L = pFixAngle(q + 1.915 * pSin(g) + 0.020 * pSin(2 * g));
  const e = 23.439 - 0.00000036 * D;
  const RA = pFixHour(pArctan2(pCos(e) * pSin(L), pCos(L)) / 15);
  const eqt = q / 15 - RA;
  const decl = pArcsin(pSin(e) * pSin(L));
  return { decl, eqt };
}
function computePrayerTimes(lat, lng, tzOffsetHours, dateObj) {
  const jd = julianDate(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate());
  const { decl, eqt } = sunPosition(jd);
  const dhuhrHours = 12 + tzOffsetHours - lng / 15 - eqt;
  const timeDiff = (angle) => {
    const val = (pSin(angle) - pSin(lat) * pSin(decl)) / (pCos(lat) * pCos(decl));
    if (val > 1 || val < -1) return null;
    return pArccos(val) / 15;
  };
  const fajrDiff = timeDiff(-18);
  const ishaDiff = timeDiff(-17);
  const maghribDiff = timeDiff(-0.833);
  const asrAngle = pArccot(1 + pTan(Math.abs(lat - decl)));
  const asrDiff = timeDiff(asrAngle);
  const toHM = (h) => {
    if (h === null) return null;
    h = pFixHour(h);
    const hh = Math.floor(h);
    const mm = Math.round((h - hh) * 60);
    return String(hh).padStart(2, "0") + ":" + String(mm === 60 ? 0 : mm).padStart(2, "0");
  };
  return {
    Fajr: toHM(fajrDiff !== null ? dhuhrHours - fajrDiff : null),
    Dhuhr: toHM(dhuhrHours),
    Asr: toHM(asrDiff !== null ? dhuhrHours + asrDiff : null),
    Maghrib: toHM(maghribDiff !== null ? dhuhrHours + maghribDiff : null),
    Isha: toHM(ishaDiff !== null ? dhuhrHours + ishaDiff : null),
  };
}

function computeSurahRevisionPlan(dateStr, statusMap) {
  const dayIndex = Math.floor(new Date(dateStr + "T00:00:00").getTime() / 86400000);
  const weekday = new Date(dateStr + "T00:00:00").getDay();
  const pageTarget = SPECIAL_REVISION_WEEKDAYS.includes(weekday) ? SURAH_REVISION_SPECIAL_TARGET : SURAH_REVISION_WEEKDAY_TARGET;
  const todayPara = ALL_PARAS[dayIndex % ALL_PARAS.length];
  const paraSurahs = PREVIOUS_SURAHS.filter(s => s.para === todayPara);
  const byStatus = { B: [], N: [], G: [] };
  paraSurahs.forEach(s => {
    const st = (statusMap && statusMap[s.number]) || s.status;
    (byStatus[st] || byStatus.N).push(s);
  });
  const pickByPages = (list, target) => {
    if (!list.length || target <= 0) return [];
    const n = list.length;
    const start = dayIndex % n;
    const result = [];
    let pageSum = 0;
    let i = 0;
    while (pageSum < target && i < n) {
      const surah = list[(start + i) % n];
      result.push(surah);
      pageSum += surah.pages;
      i++;
    }
    return result;
  };
  return {
    para: todayPara,
    B: pickByPages(byStatus.B, pageTarget.B),
    N: pickByPages(byStatus.N, pageTarget.N),
    G: pickByPages(byStatus.G, pageTarget.G),
  };
}

function sleepSessionMinutes(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  if (isNaN(sh) || isNaN(sm) || isNaN(eh) || isNaN(em)) return 0;

  if (endMin <= startMin) endMin += 24 * 60;
  return endMin - startMin;
}

      const walkOk = (parseFloat(day.habit.walkingSteps) || 0) >= 8000;
      const waterOk = (day.habit.waterGlasses || 0) >= 8;
      const noTextOk = (noTextPeople && noTextPeople.length > 0) ? noTextPeople.every(p => (day.habit.noTextStatus || {})[p.name] === "yes") : false;
      const sleepAutoTask = computeSleepAuto(day);
      const fixed = [sleepAutoTask.earlyRising, sleepAutoTask.earlySleeping, day.habit.meditation, walkOk, day.habit.lustControl, waterOk, noTextOk, day.habit.sadaqah].every(Boolean);
      return fixed && !!day.habit.noScreenCount && !!day.habit.ghorGochano;
    }
    case "diary": return !!(day.diary.notes || (day.diary.accomplished && day.diary.events && day.diary.thoughts));
    case "accounts": return Object.values(day.accounts).some(v => v);
    case "texting": {
      if (!contacts || contacts.length === 0) return false;
      return contacts.every(n => { const e = day.texting.log[n]; return e && e.profileAvoided === true && e.textedSelf !== true; });
    }
    default: return false;
  }
}
async function computeTaskStreak(taskId, fromDate, contacts, noTextPeople) {
  let streak = 0, d = fromDate;
  for (let i = 0; i < 90; i++) {
    const rec = await getDayRaw(d);
    if (!rec) break;
    const merged = mergeDay(rec);
    if (!isTaskFullyDone(taskId, merged, contacts, noTextPeople)) break;
    streak++;
    d = shiftDate(d, -1);
  }
  return streak;
}
async function computeHabitItemStreak(fromDate, isDoneFn) {
  let streak = 0, d = fromDate;
  for (let i = 0; i < 90; i++) {
    const rec = await getDayRaw(d);
    if (!rec) break;
    const merged = mergeDay(rec);
    if (!isDoneFn(merged)) break;
    streak++;
    d = shiftDate(d, -1);
  }
  return streak;
}

function formatStopwatch(totalSec) {
  totalSec = Math.max(0, Math.floor(totalSec));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const mm = String(m).padStart(2, "0");
  const ss = String(s).padStart(2, "0");
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

  const currentEx = planExercises[stepIndex] || null;

      setStepIndex(stepIndex + 1);
      setSetsDone(0);

function PinLockScreen({ correctPin, onUnlock, darkMode }) {
  const [entered, setEntered] = useState("");
  const [error, setError] = useState(false);
  const pad = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "back"];

  const handlePress = (k) => {
    setError(false);
    if (k === "back") { setEntered(e => e.slice(0, -1)); return; }
    if (k === "") return;
    if (entered.length >= 4) return;
    const next = entered + k;
    setEntered(next);
    if (next.length === 4) {
      if (next === correctPin) {
        setTimeout(() => onUnlock(), 150);
      } else {
        setError(true);
        setTimeout(() => setEntered(""), 500);
      }
    }
  };

  return (
    <div className={"dtt-root" + (darkMode ? " dark" : "")} style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
      <div style={{ textAlign: "center", width: "100%", maxWidth: 320 }}>
        <Icon name="lock" size={34} color="#C08A3E" />
        <div style={{ fontFamily: "'Fraunces',serif", fontSize: 20, fontWeight: 700, margin: "10px 0 4px" }}>PIN দিন</div>
        <div style={{ fontSize: 12.5, color: "#8A7F68", marginBottom: 18 }}>{error ? "ভুল PIN, আবার চেষ্টা করুন" : "অ্যাপ আনলক করতে ৪-সংখ্যার PIN দিন"}</div>
        <div style={{ display: "flex", gap: 12, justifyContent: "center", marginBottom: 24 }}>
          {[0, 1, 2, 3].map(i => (
            <div key={i} style={{ width: 16, height: 16, borderRadius: "50%", border: "2px solid " + (error ? "#A14545" : "#C08A3E"), background: entered.length > i ? (error ? "#A14545" : "#C08A3E") : "transparent" }}></div>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10, maxWidth: 260, margin: "0 auto" }}>
          {pad.map((k, i) => (

            <button key={i} onClick={() => handlePress(k)}
              style={{ padding: "16px 0", fontSize: 18, fontWeight: 700, borderRadius: 14, border: "none", background: darkMode ? "#25302A" : "#F1E9D6", color: darkMode ? "#E7E0CC" : "#2B2A22", cursor: "pointer" }}>
              {k === "back" ? <Icon name="backspace" size={18} /> : k}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const PIE_COLORS = ["#4A6FA5", "#B5651D", "#8A6A2F", "#6B7A4F", "#7A5C8A", "#2F6B5E", "#A14545", "#8A4A5C"];
function CategoryPieChart({ totals, categories }) {
  const entries = categories.map((c, i) => ({ ...c, value: parseFloat(totals[c.key]) || 0, color: PIE_COLORS[i % PIE_COLORS.length] })).filter(e => e.value > 0);
  const sum = entries.reduce((s, e) => s + e.value, 0);
  if (sum <= 0) return <div className="empty-note" style={{ textAlign: "center" }}>এই মাসে এখনো কোনো খরচ যোগ হয়নি</div>;
  const cx = 100, cy = 100, r = 80;
  let angle = -90;
  const slices = entries.map(e => {
    const portion = e.value / sum;
    const startAngle = angle;
    const endAngle = angle + portion * 360;
    angle = endAngle;
    const large = (endAngle - startAngle) > 180 ? 1 : 0;
    const toXY = (deg) => {
      const rad = (deg * Math.PI) / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    };
    const [x1, y1] = toXY(startAngle);
    const [x2, y2] = toXY(endAngle);
    const path = portion >= 0.999
      ? "M " + cx + " " + (cy - r) + " A " + r + " " + r + " 0 1 1 " + (cx - 0.01) + " " + (cy - r) + " Z"
      : "M " + cx + " " + cy + " L " + x1 + " " + y1 + " A " + r + " " + r + " 0 " + large + " 1 " + x2 + " " + y2 + " Z";
    return { ...e, path, pct: Math.round(portion * 100) };
  });
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 16, alignItems: "center", justifyContent: "center" }}>
      <svg viewBox="0 0 200 200" width="160" height="160">
        {slices.map((s, i) => <path key={i} d={s.path} fill={s.color} stroke="#F7F1E3" strokeWidth="1.5" />)}
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {slices.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5 }}>
            <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, display: "inline-block" }}></span>
            <span>{s.label} — ৳{fmtMoney(s.value)} ({s.pct}%)</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function BarChart({ points, color, max }) {
  const w = 320, h = 140, padBottom = 22, padLeft = 4;
  const barGap = 4;
  const barW = Math.max(6, (w - padLeft * 2) / points.length - barGap);
  const effMax = Math.max(max, ...points.map(p => p.value), 1);
  return (
    <svg viewBox={"0 0 " + w + " " + (h + padBottom)} width="100%" height={h + padBottom}>
      {points.map((p, i) => {
        const barH = (p.value / effMax) * (h - 10);
        const x = padLeft + i * (barW + barGap);
        const y = h - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={Math.max(barH, 1)} rx="3" fill={color} opacity={p.value > 0 ? 1 : 0.25} />
            <text x={x + barW / 2} y={h + 14} fontSize="8" textAnchor="middle" fill="#8A7F68">{p.dayLabel}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ---------------- point-rating system (per user-defined rules) ---------------- */
const PRAYER_STATUS_POINTS = { qaza: -1.2, home: 2.4, mosque: 4.9 };
function pointsPrayer(rec) {
  if (!rec || !rec.prayers) return 0;
  let pts = 0;
  PRAYER_ORDER.forEach(p => {
    const pr = rec.prayers[p];
    if (pr && pr.status) {
      if (pr.status === "mosque" && (p === "Fajr" || p === "Isha")) pts += 10;
      else if (PRAYER_STATUS_POINTS[pr.status] !== undefined) pts += PRAYER_STATUS_POINTS[pr.status];
    }
    if (p === "Dhuhr") {
      if (pr && pr.sunnah2) pts += 1.2;
      if (pr && pr.sunnah4) pts += 2.4;
    } else if (pr && pr.sunnah) pts += 1.2;
    if (p === "Isha" && pr && pr.witr) pts += 3;
  });
  pts += (rec.prayers.nafl && Array.isArray(rec.prayers.nafl)) ? rec.prayers.nafl.length * 2.4 : 0;
  return pts;
}
function pointsZikir(rec) {
  if (!rec || !rec.zikir) return 0;
  let pts = 0;
  ["durud", "istegfar", "tasbihFatemi"].forEach(k => { pts += ((parseFloat(rec.zikir[k]) || 0) / 100) * 2.3; });
  (rec.zikir.custom || []).forEach(z => { pts += ((parseFloat(z.count) || 0) / 100) * 2.3; });
  return pts;
}
function pointsQuran(rec) {
  if (!rec || !rec.quran) return 0;
  const qReadPages = parseFloat(rec.quran.reading && rec.quran.reading.pages) || 0;
  const readPts = qReadPages >= 5 ? 2.5 + (qReadPages - 5) * 1.25 : 0;
  const qRevFixPages = parseFloat(rec.quran.revision && rec.quran.revision.fix && rec.quran.revision.fix.pages) || 0;
  const qRevMemPages = parseFloat(rec.quran.revision && rec.quran.revision.memorize && rec.quran.revision.memorize.pages) || 0;
  const revPts = (qRevFixPages + qRevMemPages) * 1.25;
  const amoliPts = rec.quran.amoli ? Object.values(rec.quran.amoli).filter(Boolean).length * 1.25 : 0;
  return readPts + revPts + amoliPts;
}
function pointsStudy(rec) {
  if (!rec || !rec.study) return 0;
  const topics = parseFloat(rec.study.studied && rec.study.studied.topics) || 0;
  const lectures = parseFloat(rec.study.lectures && rec.study.lectures.count) || 0;
  const subjectHours = Object.values(rec.study.subjects || {}).reduce((s, v) => s + (parseFloat(v) || 0), 0);
  const units = topics + lectures + subjectHours;
  const manualPts = units >= 1 ? 2.7 + (units - 1) * 1.3 : 0;
  const promoterMinutes = parseFloat(rec.study.promoterMinutes) || 0;
  const promoterPts = Math.round(promoterMinutes * 0.15 * 100) / 100;
  return manualPts + promoterPts;
}
function pointsExercise(rec) {
  if (!rec || !rec.exercise) return 0;
  const totalSets = rec.exercise.checklist ? Object.values(rec.exercise.checklist).reduce((s, v) => s + (parseInt(v) || 0), 0) : 0;
  const quickMinutes = parseFloat(rec.exercise.quickSessionMinutes) || 0;
  const quickPts = Math.round(quickMinutes * WORKOUT_POINTS_PER_MIN * 100) / 100;
  return totalSets * 1.2 + quickPts;
}
function habitUntickCount(rec) {
  if (!rec || !rec.habit || !rec.habit.unticks) return 0;
  return Object.values(rec.habit.unticks).reduce((s, v) => s + (parseInt(v) || 0), 0);
}
function pointsHabit(rec) {
  if (!rec || !rec.habit) return 0;
  const h = rec.habit;
  let pts = 0;
  if (h.meditation) pts += 2.4;
  const water = parseFloat(h.waterGlasses) || 0;
  if (water >= 4) pts += 2.4 + Math.floor((water - 4) / 2) * 1.2;
  pts += (parseInt(h.noScreenCount) || 0) * 1.2;
  const mainSleepStart = (Array.isArray(h.sleepSessions) && h.sleepSessions[0] && h.sleepSessions[0].start) ? h.sleepSessions[0].start : h.sleepTime;
  if (mainSleepStart) {
    const parts = mainSleepStart.split(":").map(Number);
    const sh = parts[0], sm = parts[1];
    if (!isNaN(sh)) {
      if (sh >= 12) pts += 2.4;
      else pts -= Math.ceil(sh + (sm || 0) / 60) * 1.2;
    }
  }
  const sleepAutoPts = computeSleepAuto(rec);
  if (sleepAutoPts.earlyRising) pts += 1.2;
  if (sleepAutoPts.earlySleeping) pts += 1.2;
  Object.values(h.noTextStatus || {}).forEach(status => { if (status === "yes") pts += 1.2; else if (status === "no") pts -= 1.2; });
  if (h.lustControl) pts += 2.4;
  pts += (parseInt(h.ghorGochano) || 0) * 1.2;
  pts -= (parseInt(h.ghorGochanoMiss) || 0) * 1.2;
  pts -= habitUntickCount(rec) * 0.6;
  return pts;
}

function PointsBarChart({ points, color, maxPerDay }) {
  const w = 320, h = 130, padBottom = 16, padTop = 16, padLeft = 4;
  const barGap = points.length > 15 ? 1.5 : 4;
  // points.length == range (৭ বা ৩০) — প্রতিদিনের জন্য আলাদা একটা করে কলাম, প্রতিটা তারিখ আলাদাভাবে নিচে দেখানো হয়
  const barW = Math.max(3, (w - padLeft * 2) / Math.max(points.length, 1) - barGap);
  const dateFontSize = points.length > 15 ? 5.2 : 8;
  const showValueLabels = points.length <= 15;
  const vals = points.map(p => p.value);
  const maxV = Math.max(0, ...vals, maxPerDay || 0, 0.5);
  const minV = Math.min(0, ...vals);
  const range = (maxV - minV) || 1;
  const scale = (h - padTop) / range;
  const zeroY = padTop + (maxV - 0) * scale;
  const targetY = maxPerDay > 0 ? padTop + (maxV - maxPerDay) * scale : null;
  return (
    <svg viewBox={"0 0 " + w + " " + (h + padBottom)} width="100%" height={h + padBottom}>
      <line x1={padLeft} y1={zeroY} x2={w - padLeft} y2={zeroY} stroke="#D9CFAF" strokeWidth="1" />
      {targetY !== null && (
        <>
          <line x1={padLeft} y1={targetY} x2={w - padLeft} y2={targetY} stroke="#C08A3E" strokeWidth="1" strokeDasharray="3,2" />
          <text x={w - padLeft} y={targetY - 2} fontSize="6.5" fontWeight="700" textAnchor="end" fill="#C08A3E">দৈনিক লক্ষ্য</text>
        </>
      )}
      {points.map((p, i) => {
        const x = padLeft + i * (barW + barGap);
        const yVal = padTop + (maxV - p.value) * scale;
        const barY = Math.min(yVal, zeroY);
        const barH = Math.max(Math.abs(yVal - zeroY), 1);
        const barColor = p.value < 0 ? "#A14545" : color;
        return (
          <g key={i}>
            {showValueLabels && (
              <text x={x + barW / 2} y={Math.max(barY - 3, 8)} fontSize="6.5" fontWeight="700" textAnchor="middle" fill="#8A7F68">
                {(Math.round(p.value * 10) / 10).toFixed(1)}
              </text>
            )}
            <rect x={x} y={barY} width={barW} height={barH} rx="2" fill={barColor} opacity={p.value !== 0 ? 1 : 0.25} />
            <text x={x + barW / 2} y={h + 12} fontSize={dateFontSize} textAnchor="middle" fill="#8A7F68">{p.dayLabel}</text>
          </g>
        );
      })}
    </svg>
  );
}

function composeDiaryDisplay(diary) {
  if (!diary) return null;
  if (diary.notes && diary.notes.trim()) return { type: "notes", text: diary.notes };
  const sections = [];
  if (diary.accomplished) sections.push({ label: "আজ কী অর্জন করেছি", text: diary.accomplished });
  if (diary.events) sections.push({ label: "গুরুত্বপূর্ণ ঘটনা", text: diary.events });
  if (diary.thoughts) sections.push({ label: "ব্যক্তিগত ভাবনা", text: diary.thoughts });
  if (diary.reflection) sections.push({ label: "দিনের প্রতিফলন", text: diary.reflection });
  if (sections.length === 0) return null;
  return { type: "sections", sections };
}

function DiaryReaderModal({ initialDate, onClose }) {
  const [loading, setLoading] = useState(true);
  const [entries, setEntries] = useState([]);
  const [index, setIndex] = useState(0);
  const touchStartX = useRef(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const list = await storage.list("day:");
      const keys = list.keys.sort();
      const found = [];
      for (const k of keys) {
        const ds = k.slice(4);
        const rec = await getDayRaw(ds);
        if (!rec || !rec.diary) continue;
        const composed = composeDiaryDisplay(rec.diary);
        const gratitude = Array.isArray(rec.diary.gratitude) ? rec.diary.gratitude.filter(Boolean) : [];
        if (!composed && gratitude.length === 0) continue;
        found.push({ date: ds, mood: rec.mood, composed, gratitude });
      }
      if (cancelled) return;
      setEntries(found);
      let idx = found.findIndex(e => e.date === initialDate);
      if (idx === -1) {
        const nextIdx = found.findIndex(e => e.date > initialDate);
        idx = nextIdx === -1 ? found.length - 1 : Math.max(0, nextIdx - 1);
      }
      setIndex(Math.max(0, idx));
      setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [initialDate]);

  const goPrev = useCallback(() => setIndex(i => Math.max(0, i - 1)), []);
  const goNext = useCallback(() => setIndex(i => Math.min(entries.length - 1, i + 1)), [entries.length]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "ArrowRight") goNext();
      else if (e.key === "ArrowLeft") goPrev();
      else if (e.key === "Escape") onClose();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [goPrev, goNext, onClose]);

  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStartX.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(dx) > 55) { if (dx > 0) goPrev(); else goNext(); }
    touchStartX.current = null;
  };

  const current = entries[index];
  const moodOpt = current && current.mood ? MOOD_OPTIONS.find(m => m.key === current.mood) : null;

  return (
    <div className="diary-reader-overlay" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      <div className="diary-reader-topbar">
        <button className="diary-reader-close" onClick={onClose} title="বন্ধ করুন"><Icon name="close" size={19} /></button>
        <div className="diary-reader-counter">{loading ? "লোড হচ্ছে..." : (entries.length ? (index + 1) + " / " + entries.length + " এন্ট্রি" : "")}</div>
        <div style={{ width: 36 }} />
      </div>

      {!loading && !current && (
        <div className="diary-reader-empty">এখনো কোনো ডায়েরি এন্ট্রি লেখা হয়নি<br />লেখা শুরু করলে এখানে বইয়ের পাতার মতো দেখা যাবে</div>
      )}

      {current && (
        <div className="diary-reader-page">
          <div className="diary-reader-datehead">
            <div className="diary-reader-day">{new Date(current.date + "T00:00:00").toLocaleDateString("bn-BD", { weekday: "long" })}</div>
            <div className="diary-reader-date">{new Date(current.date + "T00:00:00").toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" })}</div>
            {moodOpt && <div className="diary-reader-mood" title={moodOpt.label}>{moodOpt.emoji}</div>}
          </div>
          <div className="diary-reader-sheet">
            {current.composed && current.composed.type === "notes" && (
              <div className="diary-reader-text">{current.composed.text}</div>
            )}
            {current.composed && current.composed.type === "sections" && current.composed.sections.map((s, i) => (
              <div className="diary-reader-section" key={i}>
                <div className="diary-reader-section-label">{s.label}</div>
                <div className="diary-reader-section-text">{s.text}</div>
              </div>
            ))}
            {!current.composed && current.gratitude.length > 0 && (
              <div style={{ textAlign: "center", color: "#9A8C6C", fontFamily: "'Fraunces',serif", fontSize: 14, padding: "6px 0 4px" }}>শুধু কৃতজ্ঞতার নোট লেখা হয়েছে এই দিনে</div>
            )}
            {current.gratitude.length > 0 && (
              <div className="diary-reader-gratitude">
                {current.gratitude.map((g, i) => <span className="diary-reader-gratitude-chip" key={i}>🙏 {g}</span>)}
              </div>
            )}
          </div>
        </div>
      )}

      {!loading && entries.length > 1 && (
        <div className="diary-reader-nav">
          <button className="diary-reader-nav-btn" onClick={goPrev} disabled={index <= 0} title="আগের এন্ট্রি"><Icon name="chevron_right" size={22} /></button>
          <div className="diary-reader-hint">সোয়াইপ করেও পাতা ওল্টাতে পারবেন</div>
          <button className="diary-reader-nav-btn" onClick={goNext} disabled={index >= entries.length - 1} title="পরের এন্ট্রি"><Icon name="chevron_left" size={22} /></button>
        </div>
      )}
    </div>
  );
}

function HeatmapModal({ contacts, noTextPeople, onClose, onSelectDate }) {
  const [loading, setLoading] = useState(true);
  const [levels, setLevels] = useState({});
  const [hoverInfo, setHoverInfo] = useState(null);
  const WEEKS = 26;

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    (async () => {
      const today = todayStr();
      const days = [];
      let d = today;
      for (let i = 0; i < WEEKS * 7; i++) { days.push(d); d = shiftDate(d, -1); }
      const result = {};
      for (const ds of days) {
        const rec = await getDayRaw(ds);
        if (!rec) { result[ds] = -1; continue; }
        const merged = mergeDay(rec);
        result[ds] = dayCompletionScore(merged, contacts, noTextPeople);
      }
      if (!cancelled) { setLevels(result); setLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [contacts, noTextPeople]);

  const colorFor = (v) => {
    if (v === undefined || v === -1) return "#EFE6D2";
    if (v <= 0) return "#F3ECDA";
    if (v <= 0.25) return "#C9DCC0";
    if (v <= 0.5) return "#8FBB7A";
    if (v <= 0.75) return "#4F9450";
    return "#1F6B33";
  };

  // আজ থেকে পেছনে গিয়ে সপ্তাহ-ভিত্তিক গ্রিড বানানো (রবিবার শুরু)
  const today = todayStr();
  const todayObj = new Date(today + "T00:00:00");
  const endOffset = todayObj.getDay();
  const gridDays = [];
  let d = shiftDate(today, -endOffset);
  d = shiftDate(d, -7 * (WEEKS - 1));
  for (let w = 0; w < WEEKS; w++) {
    const week = [];
    for (let wd = 0; wd < 7; wd++) { week.push(d); d = shiftDate(d, 1); }
    gridDays.push(week);
  }

  return (
    <Modal onClose={onClose} width={440}>
      <div className="modal-header"><Icon name="grid_view" size={18} color="#2F6B5E" /><span>হ্যাবিট হিটম্যাপ</span><button className="modal-close" onClick={onClose}><Icon name="close" size={18} /></button></div>
      {loading ? (
        <div className="empty-note" style={{ textAlign: "center" }}>লোড হচ্ছে...</div>
      ) : (
        <>
          <div style={{ overflowX: "auto", paddingBottom: 8 }}>
            <div style={{ display: "flex", gap: 3 }}>
              {gridDays.map((week, wi) => (
                <div key={wi} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                  {week.map((ds, di) => (
                    <div
                      key={di}
                      onClick={() => ds <= today && onSelectDate(ds)}
                      onMouseEnter={() => setHoverInfo(ds)}
                      title={ds}
                      style={{
                        width: 12, height: 12, borderRadius: 3,
                        background: ds > today ? "transparent" : colorFor(levels[ds]),
                        cursor: ds <= today ? "pointer" : "default",
                      }}
                    ></div>
                  ))}
                </div>
              ))}
            </div>
          </div>
          {hoverInfo && (
            <div className="empty-note" style={{ textAlign: "center" }}>
              {prettyDate(hoverInfo)}: {levels[hoverInfo] !== -1 && levels[hoverInfo] !== undefined ? Math.round(levels[hoverInfo] * 100) + "% সম্পন্ন" : "কোনো ডেটা নেই"}
            </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4, marginTop: 8 }}>
            <span style={{ fontSize: 10.5, color: "#8A7F68" }}>কম</span>
            {["#EFE6D2", "#C9DCC0", "#8FBB7A", "#4F9450", "#1F6B33"].map((c, i) => (
              <div key={i} style={{ width: 10, height: 10, borderRadius: 2, background: c }}></div>
            ))}

        </>

function isoWeekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diffDays = Math.round((target - firstThursday) / 86400000);
  const weekNo = 1 + Math.floor(diffDays / 7);
  return target.getFullYear() + "-W" + String(weekNo).padStart(2, "0");
}
function isoWeekLabel(weekKey) {
  return weekKey.replace("-W", ", সপ্তাহ ");
}
function isDayFilled(dateStr) {
  try { return window.localStorage.getItem(STORAGE_PREFIX + "day:" + dateStr) !== null; }
  catch (e) { return false; }
}
const WEEKDAYS_BN = ["রবি", "সোম", "মঙ্গল", "বুধ", "বৃহ", "শুক্র", "শনি"];

function CalendarModal({ selectedDate, onSelect, onClose }) {
  const initial = new Date(selectedDate + "T00:00:00");
  const [viewYear, setViewYear] = useState(initial.getFullYear());
  const [viewMonth, setViewMonth] = useState(initial.getMonth());

  const first = new Date(viewYear, viewMonth, 1);
  const startOffset = first.getDay();
  const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString("bn-BD", { month: "long", year: "numeric" });
  const today = todayStr();

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(d);

  const goPrevMonth = () => { const m = viewMonth - 1; if (m < 0) { setViewMonth(11); setViewYear(y => y - 1); } else setViewMonth(m); };
  const goNextMonth = () => { const m = viewMonth + 1; if (m > 11) { setViewMonth(0); setViewYear(y => y + 1); } else setViewMonth(m); };

  const dateStrFor = (d) => {
    const mm = String(viewMonth + 1).padStart(2, "0");
    const dd = String(d).padStart(2, "0");
    return viewYear + "-" + mm + "-" + dd;
  };

  return (
    <Modal onClose={onClose} width={380}>
      <div className="modal-header"><Icon name="calendar_month" size={18} color="#123A34" /><span>তারিখ বেছে নিন</span><button className="modal-close" onClick={onClose}><Icon name="close" size={18} /></button></div>
      <div className="cal-header">
        <button className="cal-nav-btn" onClick={goPrevMonth}><Icon name="chevron_left" size={18} /></button>
        <div className="cal-month">{monthLabel}</div>
        <button className="cal-nav-btn" onClick={goNextMonth}><Icon name="chevron_right" size={18} /></button>
      </div>
      <div className="cal-grid">
        {WEEKDAYS_BN.map(w => <div className="cal-wd" key={w}>{w}</div>)}
        {cells.map((d, i) => {
          if (d === null) return <div className="cal-day empty-cell" key={"e" + i}></div>;
          const ds = dateStrFor(d);
          const filled = isDayFilled(ds);
          const isToday = ds === today;
          const isSelected = ds === selectedDate;
          return (
            <div key={ds} className={"cal-day" + (isToday ? " today" : "") + (isSelected ? " selected" : "")}
              onClick={() => { onSelect(ds); onClose(); }}>
              {d}
              {filled && <div className="cal-dot"></div>}
            </div>
          );
        })}
      </div>
    </Modal>
  );
}

function exportBackup() {
  try {
    const data = {};
    for (let i = 0; i < window.localStorage.length; i++) {
      const key = window.localStorage.key(i);
      if (key && key.startsWith(STORAGE_PREFIX)) data[key] = window.localStorage.getItem(key);
    }
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "daily-life-backup-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) { alert("ব্যাকআপ নেওয়া যায়নি।"); }
}
async function importOldDiaryBackup(onDone) {
  const entries = Object.entries(DIARY_BACKUP_DATA);
  let imported = 0, merged = 0, skipped = 0;
  for (const [ds, entry] of entries) {
    const text = (entry && entry.text || "").trim();
    if (!text) continue;
    const raw = await getDayRaw(ds);
    const base = mergeDay(raw);
    const existing = base.diary.notes || "";
    if (!existing) {
      base.diary.notes = text;
      base.diary.lastEditTime = base.diary.lastEditTime || new Date(entry.updatedAt || ds).getTime();
      imported++;
    } else if (existing.indexOf(text) === -1) {
      base.diary.notes = existing + "\n\n" + text;
      merged++;
    } else {
      skipped++;
      continue;
    }
    await storage.set("day:" + ds, JSON.stringify(base));
  }
  onDone({ imported, merged, skipped, total: entries.length });
}
function importBackup(file, onDone) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      Object.keys(data).forEach(k => { if (k.startsWith(STORAGE_PREFIX)) window.localStorage.setItem(k, data[k]); });
      onDone(true);
    } catch (err) { onDone(false); }
  };
  reader.onerror = () => onDone(false);
  reader.readAsText(file);
}

function NotePinPad({ mode, onSubmitPin, onCancel }) {
  // mode: "unlock" | "set" — onSubmitPin(pin) returns a Promise<boolean> for "unlock", or is called once for "set" after confirmation
  const [step, setStep] = useState(mode === "unlock" ? "unlock" : "new");
  const [draft, setDraft] = useState("");
  const [first, setFirst] = useState("");
  const [error, setError] = useState("");
  const [checking, setChecking] = useState(false);

  const onChangeDraft = (val) => {
    if (val.length > 32 || checking) return;
    setDraft(val);
    setError("");
  };

  const trySubmit = async () => {
    if (checking) return;
    if (step !== "unlock" && draft.length < 8) { setError("অন্তত ৮ ক্যারেক্টারের পাসফ্রেজ দিন"); return; }
    setError("");
    if (step === "unlock") {
      setChecking(true);
      const ok = await onSubmitPin(draft);
      setChecking(false);
      if (!ok) { setError("ভুল পাসফ্রেজ, আবার চেষ্টা করুন"); setDraft(""); }
    } else if (step === "new") {
      setFirst(draft); setDraft(""); setStep("confirm");
    } else if (step === "confirm") {
      if (draft === first) { setChecking(true); await onSubmitPin(draft); setChecking(false); }
      else { setError("পাসফ্রেজ মিলেনি, আবার চেষ্টা করুন"); setStep("new"); setDraft(""); setFirst(""); }
    }
  };

  return (
    <div style={{ textAlign: "center", padding: "18px 4px 6px" }}>
      <Icon name="lock" size={28} color="#B5651D" />
      <div style={{ fontFamily: "'Fraunces',serif", fontSize: 17, fontWeight: 700, margin: "8px 0 3px" }}>
        {checking ? "যাচাই করা হচ্ছে..." : step === "unlock" ? "নোট দেখতে পাসফ্রেজ দিন" : step === "new" ? "নতুন পাসফ্রেজ দিন (৮+ ক্যারেক্টার)" : "পাসফ্রেজ আবার লিখে নিশ্চিত করুন"}
      </div>
      <div style={{ fontSize: 12, color: error ? "#A14545" : "#8A7F68", marginBottom: 14, fontWeight: error ? 600 : 400 }}>
        {error || (step === "unlock" ? "নোট এনক্রিপ্ট করা আছে, সঠিক পাসফ্রেজ ছাড়া খোলা যাবে না" : "অক্ষর ও সংখ্যা মিশিয়ে যত লম্বা পাসফ্রেজ, নোট তত নিরাপদ। ভুলে গেলে নোট আর ফেরত পাওয়া যাবে না")}
      </div>
      <div className="field" style={{ maxWidth: 220, margin: "0 auto 12px" }}>
        <input type="password" maxLength={32} autoFocus disabled={checking} value={draft} onChange={e => onChangeDraft(e.target.value)} onKeyDown={e => e.key === "Enter" && trySubmit()} placeholder="৮+ ক্যারেক্টার পাসফ্রেজ" style={{ textAlign: "center", letterSpacing: "2px", fontSize: 16 }} />
      </div>
      <button className="btn-primary" style={{ justifyContent: "center", margin: "0 auto 10px" }} onClick={trySubmit} disabled={checking || (step !== "unlock" && draft.length < 8) || draft.length === 0}>নিশ্চিত করুন</button>
      <div>
        <button className="btn-ghost" style={{ justifyContent: "center", margin: "0 auto" }} onClick={onCancel} disabled={checking}>বাতিল করুন</button>
      </div>
    </div>
  );
}

  ];

  const migrateOldFormat = (oldList) => {
    const d = defaultData();

    const noteLines = [];
    oldList.forEach(n => {
      if (n.kind === "contact") {
        (n.entries || []).forEach(e => {
          if ((e.name || "").trim() || (e.number || "").trim()) {
            d.contacts.push({ id: genId(), name: e.name || "", numbers: (e.number || "").trim() ? [{ id: genId(), value: e.number }] : [] });
          }
          if ((e.note || "").trim()) noteLines.push((e.name || "কন্টাক্ট") + ": " + e.note);
        });
      } else {
        (n.entries || []).forEach(e => {
          const hay = ((e.label || "") + " " + (n.title || "")).toLowerCase();
          const target = (hay.includes("fb") || hay.includes("facebook")) ? d.fb : d.gmail;

          }
        });
      }
      if ((n.content || "").trim()) noteLines.push((n.title || "নোট") + ": " + n.content);
    });
    d.importantNote = noteLines.join("\n\n");
    return d;
  };

  const copyText = async (text, onDone) => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text || "");
      } else {
        const ta = document.createElement("textarea");
        ta.value = text || ""; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      }
      onDone && onDone();
    } catch (e) {}
  };

  const copyField = (entryId, field, value) => copyText(value, () => { setCopiedField(entryId + ":" + field); setTimeout(() => setCopiedField(f => f === entryId + ":" + field ? null : f), 1200); });

  useEffect(() => {
    (async () => {
      try {
        const saltRes = await storage.get("privacyNotesSalt");
        if (saltRes && saltRes.value) {
          setEncrypted(true); setSalt(saltRes.value); setUnlocked(false); setLoading(false);
          return;
        }
      } catch (e) { /* no salt saved -> not encrypted yet */ }
      let d = defaultData();
      try {
        const r = await storage.get("privacyNotes");
        if (r && r.value) {
          const parsed = JSON.parse(r.value);
          if (Array.isArray(parsed)) {
            d = migrateOldFormat(parsed);
            storage.set("privacyNotes", JSON.stringify(d)).catch(() => {});
          } else if (parsed && typeof parsed === "object") {
            d = { ...defaultData(), ...parsed };
          }
        } else {
          try {
            const old = await storage.get("importantNote");
            if (old && old.value) { d.importantNote = old.value; storage.set("privacyNotes", JSON.stringify(d)).catch(() => {}); }
          } catch (e2) {}
        }
      } catch (e) {}
      setData(d); setEncrypted(false); setUnlocked(true); setLoading(false);
    })();
    // eslint-disable-next-line
  }, []);

  const persistData = async (nextData, activePin, activeSalt, isEncrypted) => {
    setData(nextData);
    try {
      if (isEncrypted) {
        const payload = await pnEncrypt(nextData, activePin, activeSalt);
        await storage.set("privacyNotes", JSON.stringify(payload));
      } else {
        await storage.set("privacyNotes", JSON.stringify(nextData));
      }
    } catch (e) { console.error(e); }
  };

  const attemptUnlock = async (candidatePin) => {
    try {
      const raw = await storage.get("privacyNotes");
      const payload = raw ? JSON.parse(raw.value) : { iv: "", data: "" };
      const decrypted = payload && payload.data ? await pnDecrypt(payload, candidatePin, salt) : defaultData();
      const finalData = (decrypted && typeof decrypted === "object" && !Array.isArray(decrypted)) ? { ...defaultData(), ...decrypted } : migrateOldFormat(decrypted);
      setData(finalData); setPin(candidatePin); setUnlocked(true);
      return true;
    } catch (e) {
      return false;
    }
  };

  const activatePin = async (newPin) => {
    const newSalt = pnRandomSalt();
    try {
      const payload = await pnEncrypt(data, newPin, newSalt);
      await storage.set("privacyNotesSalt", newSalt);
      await storage.set("privacyNotes", JSON.stringify(payload));
      setSalt(newSalt); setPin(newPin); setEncrypted(true);
      setPinMsg(showPinSetup === "change" ? "PIN পরিবর্তন হয়েছে ✓" : "নোট এনক্রিপ্ট হয়েছে ✓");
      setTimeout(() => setPinMsg(""), 3000);
    } catch (e) { setLoadError("এনক্রিপশন ব্যর্থ হয়েছে, আবার চেষ্টা করুন"); }
    setShowPinSetup(false);
  };

  const removePin = async () => {
    if (!window.confirm("এনক্রিপশন বন্ধ করলে নোট আবার সাধারণভাবে (এনক্রিপ্ট ছাড়া) সেভ হবে। এগিয়ে যেতে চান?")) return;
    try { await storage.set("privacyNotes", JSON.stringify(data)); } catch (e) {}
    try { window.localStorage.removeItem(STORAGE_PREFIX + "privacyNotesSalt"); } catch (e) {}
    setEncrypted(false); setPin(""); setSalt("");
  };

  const openCategory = (key) => {
    setActiveCategory(key);
    if (key === "importantNote") {
      setNoteDraft(data.importantNote || "");
      setBlurred(!!(data.importantNote || "").trim());
      setNoteEditing(false);
      setScreen("note");
    } else {
      setScreen("list");
    }
  };
  const backToCategories = () => { setScreen("categories"); setActiveCategory(null); };

  const openNewEntry = () => {
    setActiveId(null);
    if (activeCategory === "contacts") {
      setContactNameDraft(""); setNumbersDraft([{ id: genId(), value: "" }]);
    } else {
      setNameDraft(""); setPassDraft(""); setSiteDraft("");
    }
    setVisiblePass({});
    setBlurred(false);
    setScreen("edit");
  };
  const openExistingEntry = (entry) => {
    setActiveId(entry.id);
    if (activeCategory === "contacts") {
      setContactNameDraft(entry.name || ""); setNumbersDraft(entry.numbers && entry.numbers.length ? entry.numbers : [{ id: genId(), value: "" }]);
    } else {
      setNameDraft(entry.name || ""); setPassDraft(entry.pass || ""); setSiteDraft(entry.site || "");

    setVisiblePass({});

    setScreen("view");

  const addNumberField = () => setNumbersDraft(list => [...list, { id: genId(), value: "" }]);
  const updateNumberField = (id, value) => setNumbersDraft(list => list.map(n => n.id === id ? { ...n, value } : n));
  const removeNumberField = (id) => setNumbersDraft(list => list.filter(n => n.id !== id));

  const [syncingContacts, setSyncingContacts] = useState(false);
  const [syncMsg, setSyncMsg] = useState("");
  const syncPhoneContacts = async () => {
    if (!(navigator.contacts && typeof navigator.contacts.select === "function")) {
      window.alert("এই ব্রাউজার/ডিভাইসে ফোন কন্টাক্ট সিঙ্ক সাপোর্ট করে না। এই ফিচারটি বর্তমানে শুধুমাত্র Android-এ Chrome ব্রাউজারে কাজ করে।");
      return;
    }
    setSyncingContacts(true);
    setSyncMsg("");
    try {
      const picked = await navigator.contacts.select(["name", "tel"], { multiple: true });
      if (!picked || !picked.length) { setSyncingContacts(false); return; }
      const now = Date.now();
      let nextContacts = [...data.contacts];
      let addedCount = 0, updatedCount = 0;
      picked.forEach(p => {
        const pname = ((p.name && p.name[0]) || "নামহীন").trim() || "নামহীন";
        const tels = (Array.isArray(p.tel) ? p.tel : []).map(t => (t || "").trim()).filter(Boolean);
        const existingIdx = nextContacts.findIndex(c => (c.name || "").trim().toLowerCase() === pname.toLowerCase());
        if (existingIdx >= 0) {
          const existing = nextContacts[existingIdx];
          const existingVals = new Set((existing.numbers || []).map(n => n.value));
          const merged = [...(existing.numbers || [])];
          let changed = false;
          tels.forEach(t => { if (!existingVals.has(t)) { merged.push({ id: genId(), value: t }); changed = true; } });
          if (changed) { nextContacts[existingIdx] = { ...existing, numbers: merged, updatedAt: now }; updatedCount++; }
        } else {
          nextContacts.push({ id: genId(), name: pname, numbers: tels.map(t => ({ id: genId(), value: t })), updatedAt: now });
          addedCount++;
        }
      });
      persistData({ ...data, contacts: nextContacts }, pin, salt, encrypted);
      setSyncMsg(addedCount + "টি নতুন ও " + updatedCount + "টি আপডেট হয়েছে ✓");
      setTimeout(() => setSyncMsg(""), 3500);
    } catch (e) {
      // user cancelled the picker or permission denied — no need to show an error
    }
    setSyncingContacts(false);
  };

      const now = Date.now();
      const entry = { id: activeId || genId(), name: contactNameDraft.trim() || "নামহীন", numbers: cleanNumbers, updatedAt: now };
      const nextList = activeId ? data.contacts.map(c => c.id === activeId ? entry : c) : [entry, ...data.contacts];

          <div className="empty-note" style={{ textAlign: "center", padding: "24px 0" }}>লোড হচ্ছে...</div>

        <div className="modal-body-scroll">
          <NotePinPad mode="unlock" onSubmitPin={attemptUnlock} onCancel={onClose} />
        </div>

        <div className="modal-body-scroll">
          <NotePinPad mode="set" onSubmitPin={activatePin} onCancel={() => setShowPinSetup(false)} />

  const headerTitle = screen === "categories" ? "প্রাইভেসি নোট"

    : screen === "view" ? (catMeta ? catMeta.label : "দেখুন")
    : screen === "note" ? "গুরুত্বপূর্ণ নোট"
    : (activeId ? "এডিট করুন" : "নতুন যোগ করুন");
  const headerBack = screen === "list" ? backToCategories
    : screen === "view" ? (() => setScreen("list"))
    : screen === "edit" ? (() => setScreen(activeId ? "view" : "list"))
    : screen === "note" ? backToCategories
    : null;

  return (
    <Modal onClose={onClose} width={520} fullPage>
      <div className="modal-header">
        {headerBack && <button className="icon-btn ghost" onClick={headerBack} title="ফিরে যান"><Icon name="arrow_back" size={18} /></button>}
        <Icon name={catMeta ? catMeta.icon : "sticky_note_2"} size={18} color="#B5651D" />
        <span>{headerTitle}</span>
        <button className="modal-close" onClick={onClose}><Icon name="close" size={18} /></button>
      </div>

      <div className="modal-body-scroll">
      {screen === "categories" && (
        <>
          {!pnCryptoAvailable && (
            <div className="empty-note" style={{ padding: "0 0 8px", color: "#A14545" }}>এই ব্রাউজারে এনক্রিপশন সাপোর্ট নেই, তাই নোট এনক্রিপ্ট করা যাবে না।</div>
          )}
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
            {encrypted ? (
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                <span style={{ display: "flex", alignItems: "center", gap: 6, background: "#123A34", color: "#FBF6EA", borderRadius: 999, padding: "6px 12px", fontSize: 11.5, fontWeight: 700 }}>
                  <Icon name="lock" size={14} /> এনক্রিপ্ট করা আছে
                </span>
                <button className="btn-ghost" style={{ padding: "6px 12px", fontSize: 11.5 }} onClick={() => setShowPinSetup("change")}>PIN পরিবর্তন</button>
                <button className="btn-ghost" style={{ padding: "6px 12px", fontSize: 11.5 }} onClick={removePin}>বন্ধ করুন</button>
              </div>
            ) : (
              pnCryptoAvailable && (
                <button
                  style={{ display: "flex", alignItems: "center", gap: 6, background: "#F1E9D6", color: "#6B5A3A", border: "none", borderRadius: 999, padding: "6px 12px", fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}
                  onClick={() => setShowPinSetup("activate")}
                >
                  <Icon name="lock_open" size={14} /> PIN দিয়ে এনক্রিপ্ট করুন
                </button>

          </div>
          {pinMsg && <div className="goal-ok" style={{ marginBottom: 8 }}>{pinMsg}</div>}
          {loadError && <div className="empty-note" style={{ color: "#A14545" }}>{loadError}</div>}

          <div>
            {CATEGORIES.map(c => {
              const count = c.key === "importantNote" ? null : (data[c.key] || []).length;
              const subtitle = c.key === "importantNote"
                ? ((data.importantNote || "").trim() ? (data.importantNote.replace(/\n/g, " ").slice(0, 60)) : "খালি — ট্যাপ করে লিখুন")
                : (count > 0 ? count + "টি সেভ করা আছে" : "এখনো কিছু যোগ করা হয়নি");
              return (
                <div key={c.key} className="nafl-item" style={{ cursor: "pointer", alignItems: "center" }} onClick={() => openCategory(c.key)}>
                  <div className="task-card-icon" style={{ width: 36, height: 36, background: "#F1E9D6" }}>
                    <Icon name={c.icon} size={19} color="#B5651D" />

                    <div style={{ fontSize: 12, color: "#A69B7F", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{subtitle}</div>
                  </div>
                  <Icon name="chevron_left" size={18} color="#C6BB9C" />
                </div>

            })}
          </div>
          <div className="empty-note" style={{ padding: "10px 0 0" }}>
            এই অপশনগুলো প্রধান লিস্টে দেখানো হয় না, শুধু এই আইকন থেকে খোলা যায়।{encrypted ? " তথ্যগুলো এখন AES-256 দিয়ে এনক্রিপ্ট করে সেভ হয় — সঠিক PIN ছাড়া কেউ পড়তে পারবে না। PIN ভুলে গেলে ফেরত পাওয়া যাবে না, তাই মনে রাখুন।" : ""}
          </div>

      {screen === "list" && activeCategory !== "importantNote" && (

          {activeCategory === "contacts" && (

                <Icon name="sync" size={16} /> {syncingContacts ? "সিঙ্ক হচ্ছে..." : "ফোন থেকে কন্টাক্ট সিঙ্ক করুন"}

          {(data[activeCategory] || []).length === 0 ? (

                    <div className="n-name" style={{ marginBottom: 2 }}>{activeCategory === "other" ? item.site : item.name}</div>
                    <div style={{ fontSize: 12, color: "#A69B7F", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      {activeCategory === "contacts"
                        ? (item.numbers && item.numbers.length ? item.numbers.map(n => n.value).join(", ") : "কোনো নাম্বার নেই")
                        : activeCategory === "other"
                        ? ((item.name ? item.name : "") + (item.name && item.pass ? " · " : "") + (item.pass ? "••••••••" : (item.name ? "" : "কোনো তথ্য নেই")))
                        : (item.pass ? "••••••••" : "কোনো পাসওয়ার্ড নেই")}
                    </div>
                  </div>
                  <button

                      copyText(text, () => { setCopiedRow(item.id); setTimeout(() => setCopiedRow(id => id === item.id ? null : id), 1200); });
                    }}
                    title="কপি করুন"
                  >
                    <Icon name={copiedRow === item.id ? "check" : "content_copy"} size={15} />
                  </button>
                  <button className="icon-btn ghost" onClick={(e) => { e.stopPropagation(); deleteEntry(item.id); }}><Icon name="delete" size={15} /></button>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {screen === "view" && activeCategory === "contacts" && (
        <>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
            <button
              style={{ display: "flex", alignItems: "center", gap: 6, background: blurred ? "#B5651D" : "#F1E9D6", color: blurred ? "#FBF6EA" : "#6B5A3A", border: "none", borderRadius: 999, padding: "6px 12px", fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}
              onClick={() => setBlurred(b => !b)}

              <Icon name={blurred ? "visibility_off" : "lock_open"} size={14} /> {blurred ? "ব্লার চালু আছে — দেখতে ট্যাপ করুন" : "প্রাইভেসি ব্লার"}
            </button>
          </div>
          <div style={blurred ? { filter: "blur(7px)", userSelect: "none", transition: "filter .15s" } : { transition: "filter .15s" }} onClick={() => blurred && setBlurred(false)}>
            <div className="field" style={{ marginBottom: 10 }}>
              <label>কন্টাক্ট নাম</label>
              <div style={{ fontSize: 15, fontWeight: 600, userSelect: "text" }}>{contactNameDraft || "নামহীন"}</div>
            </div>
            <label style={{ fontSize: 12, fontWeight: 700, color: "#8A7F68", display: "block", marginBottom: 6 }}>ফোন নাম্বারসমূহ</label>
            {numbersDraft.filter(n => (n.value || "").trim()).length === 0 ? (
              <div className="empty-note" style={{ padding: "4px 0 10px" }}>কোনো নাম্বার নেই</div>
            ) : numbersDraft.filter(n => (n.value || "").trim()).map(n => (
              <div key={n.id} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 8 }}>
                <div style={{ flex: 1, border: "1.5px solid #E1D6B8", background: "#FFFDF7", borderRadius: 8, padding: "6px 8px", fontSize: 13, userSelect: "text" }}>{n.value}</div>
                <button className="icon-btn ghost" onClick={() => copyField(n.id, "num", n.value)} title="কপি করুন">
                  <Icon name={copiedField === (n.id + ":num") ? "check" : "content_copy"} size={15} />
                </button>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <button className="btn-ghost" style={{ flex: 1, justifyContent: "center" }} onClick={() => setScreen("list")}>ফিরে যান</button>

            </button>
          </div>

      )}

      {screen === "edit" && activeCategory === "contacts" && (
        <>

      else window.localStorage.removeItem(STORAGE_PREFIX + "pin");
    } catch (e) {}
  };
  const [prayerCoords, setPrayerCoordsState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "prayerCoords");
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  });
  const setPrayerCoords = (coords) => {
    setPrayerCoordsState(coords);
    try {
      if (coords) window.localStorage.setItem(STORAGE_PREFIX + "prayerCoords", JSON.stringify(coords));
      else window.localStorage.removeItem(STORAGE_PREFIX + "prayerCoords");
    } catch (e) {}
  };
  const toggleDarkMode = () => {
    setDarkMode(prev => {
      const next = !prev;
      try { window.localStorage.setItem(STORAGE_PREFIX + "darkMode", next ? "1" : "0"); } catch (e) {}
      return next;
    });
  };

  const DEFAULT_CARD_ORDER = ["prayer", "zikir", "quran", "study", "exercise", "habit", "texting", "diary", "accounts", "plan"];
  const [cardOrder, setCardOrderState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "cardOrder");
      const saved = raw ? JSON.parse(raw) : null;
      if (!Array.isArray(saved)) return DEFAULT_CARD_ORDER;
      const merged = saved.filter(id => DEFAULT_CARD_ORDER.includes(id));
      DEFAULT_CARD_ORDER.forEach(id => { if (!merged.includes(id)) merged.push(id); });
      return merged;
    } catch (e) { return DEFAULT_CARD_ORDER; }
  });
  const [hiddenCards, setHiddenCardsState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "hiddenCards");
      const saved = raw ? JSON.parse(raw) : null;
      return Array.isArray(saved) ? saved : [];
    } catch (e) { return []; }
  });
  const setCardOrder = (next) => {
    setCardOrderState(next);
    try { window.localStorage.setItem(STORAGE_PREFIX + "cardOrder", JSON.stringify(next)); } catch (e) {}
  };
  const setHiddenCards = (next) => {
    setHiddenCardsState(next);
    try { window.localStorage.setItem(STORAGE_PREFIX + "hiddenCards", JSON.stringify(next)); } catch (e) {}
  };
  const moveCardOrder = (id, dir) => {
    const idx = cardOrder.indexOf(id);
    const swapWith = idx + dir;
    if (idx < 0 || swapWith < 0 || swapWith >= cardOrder.length) return;
    const next = [...cardOrder];
    [next[idx], next[swapWith]] = [next[swapWith], next[idx]];
    setCardOrder(next);
  };
  const toggleCardHidden = (id) => {
    setHiddenCards(hiddenCards.includes(id) ? hiddenCards.filter(x => x !== id) : [...hiddenCards, id]);
  };
  const resetHiddenCards = () => setHiddenCards([]);

  const [hijriOffsetDays, setHijriOffsetDaysState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "hijriOffset");
      return raw ? parseInt(raw) || 0 : 0;
    } catch (e) { return 0; }
  });
  const setHijriOffsetDays = (value) => {
    setHijriOffsetDaysState(value);
    try { window.localStorage.setItem(STORAGE_PREFIX + "hijriOffset", String(value)); } catch (e) {}
  };

  const [reminderSettings, setReminderSettingsState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "reminders");
      const defaults = { enabled: false, wakeTime: "05:00", sleepTime: "23:30", taskUpdateTime: "23:30", waterReminderOn: false, prayerAlertsOn: false };
      return raw ? { ...defaults, ...JSON.parse(raw) } : defaults;
    } catch (e) { return { enabled: false, wakeTime: "05:00", sleepTime: "23:30", taskUpdateTime: "23:30", waterReminderOn: false, prayerAlertsOn: false }; }
  });
  const setReminderSettings = (next) => {
    setReminderSettingsState(next);
    try { window.localStorage.setItem(STORAGE_PREFIX + "reminders", JSON.stringify(next)); } catch (e) {}
  };
  const lastFiredRef = useRef({ wake: null, sleep: null, taskUpdate: null, water: {} });
  const dayRef = useRef(null);
  const billsRef = useRef([]);
  const dateRef = useRef(date);
  const WATER_CHECK_HOURS = [9, 11, 13, 15, 17, 19, 21];
  const prayerTimesCacheRef = useRef({ date: null, times: null });

  useEffect(() => {
    if (!reminderSettings.enabled) return;
    const check = () => {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const nowHM = hh + ":" + mm;
      const todayKey = todayStr(now);
      const fireNotif = (title, body, tag) => {
        if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
        const fallback = () => { try { new Notification(title, { body, icon: "icon-192.png" }); } catch (e) {} };
        if (navigator.serviceWorker) {
          const readyPromise = navigator.serviceWorker.ready;
          const timeout = new Promise((resolve) => setTimeout(() => resolve(null), 1500));
          Promise.race([readyPromise, timeout]).then((reg) => {
            if (reg && reg.showNotification) {
              reg.showNotification(title, { body, icon: "icon-192.png", badge: "icon-192.png", tag, renotify: !!tag });
            } else {
              fallback();
            }
          }).catch(fallback);
        } else {
          fallback();
        }
      };
      if (reminderSettings.wakeTime && nowHM >= reminderSettings.wakeTime && lastFiredRef.current.wake !== todayKey) {
        lastFiredRef.current.wake = todayKey;
        fireNotif("আর্লি রাইজিং সময় হয়ে গেছে ⏰", "উঠে পড়ার সময় হয়েছে — ফজরের সময়টা কাজে লাগান।", "wake");
      }
      if (reminderSettings.sleepTime && nowHM >= reminderSettings.sleepTime && lastFiredRef.current.sleep !== todayKey) {
        lastFiredRef.current.sleep = todayKey;
        fireNotif("ঘুমানোর সময় হয়ে গেছে 🌙", "১২টার আগে ঘুমিয়ে পড়ুন — আর্লি স্লিপিং অভ্যাসটা ধরে রাখুন।", "sleep");
      }
      if (reminderSettings.taskUpdateTime && nowHM >= reminderSettings.taskUpdateTime && lastFiredRef.current.taskUpdate !== todayKey) {
        lastFiredRef.current.taskUpdate = todayKey;
        fireNotif("আজকের টাস্ক আপডেট করেছেন? 📝", "দিন শেষ হওয়ার আগে আজকের সব সেকশন পূরণ/আপডেট করে নিন।", "taskUpdate");
      }
      if (reminderSettings.waterReminderOn && dateRef.current === todayKey) {
        const nowHour = now.getHours();
        const passedHours = WATER_CHECK_HOURS.filter(h => h <= nowHour);
        if (passedHours.length > 0) {
          const lastPassedHour = passedHours[passedHours.length - 1];
          const idx = WATER_CHECK_HOURS.indexOf(lastPassedHour);
          const fireKey = todayKey + "_" + lastPassedHour;
          const expected = idx + 1;
          const current = parseFloat(dayRef.current?.habit?.waterGlasses) || 0;
          if (!lastFiredRef.current.water[fireKey] && current < expected) {
            lastFiredRef.current.water[fireKey] = true;
            fireNotif("পানি খাওয়ার সময় 💧", "আজকের পানির গ্লাস এখনো কম হয়েছে (" + current + " গ্লাস) — একটু পানি খেয়ে নিন।", "water");
          }
        }
      }
      if (reminderSettings.prayerAlertsOn && prayerCoords) {
        if (prayerTimesCacheRef.current.date !== todayKey) {
          const tzOffset = -now.getTimezoneOffset() / 60;
          prayerTimesCacheRef.current = { date: todayKey, times: computePrayerTimes(prayerCoords.lat, prayerCoords.lng, tzOffset, now) };
        }

  todaySubjects.forEach(sub => {

  pendingHabitItems.forEach(item => {

  [["accomplished", "আজ কী অর্জন করেছি"], ["events", "গুরুত্বপূর্ণ ঘটনা"], ["thoughts", "ব্যক্তিগত ভাবনা"]].forEach(([f, lbl]) => {

                  <div className="add-row">
                    <input placeholder="কী কিনেছেন" value={selfPurchaseItem} onChange={e => setSelfPurchaseItem(e.target.value)} onKeyDown={e => e.key === "Enter" && (addSelfPurchase(selfPurchaseItem), setSelfPurchaseItem(""))} />
                    <button className="icon-btn" onClick={() => { addSelfPurchase(selfPurchaseItem); setSelfPurchaseItem(""); }}><Icon name="add" size={18} /></button>
                  </div>
                </>
              )}

              {planSubOpen === "familyPurchases" && (
                <>
                  {monthPlan.familyPurchases.length === 0 && <div className="empty-note">এখনো কিছু যোগ করা হয়নি</div>}
                  {monthPlan.familyPurchases.map(p => (
                    <div className="nafl-item" key={p.id}>
                      <span className="n-name">{p.forWhom}</span>
                      <span className="n-rakahs">{p.item}</span>
                      <input type="date" className="n-date-input" value={p.date || ""} onChange={e => setFamilyPurchaseDate(p.id, e.target.value)} />
                      <button className="icon-btn ghost" onClick={() => removeFamilyPurchase(p.id)}><Icon name="delete" size={15} /></button>
                    </div>
                  ))}
                  <div className="add-row">
                    <input placeholder="কার জন্য" value={familyPurchaseFor} onChange={e => setFamilyPurchaseFor(e.target.value)} />
                    <input placeholder="কী কিনেছেন" value={familyPurchaseItem} onChange={e => setFamilyPurchaseItem(e.target.value)} />
                    <button className="icon-btn" onClick={() => { addFamilyPurchase(familyPurchaseFor, familyPurchaseItem); setFamilyPurchaseFor(""); setFamilyPurchaseItem(""); }}><Icon name="add" size={18} /></button>
                  </div>
                </>
              )}

              {planSubOpen === "declutterItems" && (
                <>
                  {monthPlan.declutterItems.length === 0 && <div className="empty-note">এখনো কিছু যোগ করা হয়নি</div>}
                  {monthPlan.declutterItems.map(p => (
                    <div className="nafl-item" key={p.id}>
                      <span className="n-name">{p.item}</span>
                      <input type="date" className="n-date-input" value={p.date || ""} onChange={e => setDeclutterItemDate(p.id, e.target.value)} />
                      <button className="icon-btn ghost" onClick={() => removeDeclutterItem(p.id)}><Icon name="delete" size={15} /></button>
                    </div>
                  ))}
                  <div className="add-row">
                    <input placeholder="কী পরিষ্কার/রিমুভ করেছেন" value={declutterItem} onChange={e => setDeclutterItem(e.target.value)} onKeyDown={e => e.key === "Enter" && (addDeclutterItem(declutterItem), setDeclutterItem(""))} />
                    <button className="icon-btn" onClick={() => { addDeclutterItem(declutterItem); setDeclutterItem(""); }}><Icon name="add" size={18} /></button>
                  </div>
                </>
              )}

              {planSubOpen === "places" && (
                <>
                  {monthPlan.places.length === 0 && <div className="empty-note">এখনো কোনো জায়গা যোগ করা হয়নি</div>}
                  {monthPlan.places.map(p => (
                    <div className="nafl-item" key={p.id}>
                      <span className="n-name">{p.name}</span>
                      <span className="n-rakahs">{p.date || ""}</span>
                      <button className="icon-btn ghost" onClick={() => removePlace(p.id)}><Icon name="delete" size={15} /></button>
                    </div>
                  ))}
                  <div className="add-row">
                    <input placeholder="কোথায় ঘুরতে গিয়েছেন" value={placeName} onChange={e => setPlaceName(e.target.value)} />
                    <input type="date" style={{ maxWidth: 145 }} value={placeDate} onChange={e => setPlaceDate(e.target.value)} />
                    <button className="icon-btn" onClick={() => { addPlace(placeName, placeDate); setPlaceName(""); setPlaceDate(date); }}><Icon name="add" size={18} /></button>
                  </div>
                </>
              )}
            </div>
          )}
        </Card>

        {customTasks.map(task => {
          const taskData = (day.customData || {})[task.id] || {};
          return (
            <Card key={task.id} id={"custom_" + task.id} iconName={task.icon || "star"} title={task.name} subtitle="কাস্টম টাস্ক" accent="#7A5C4A" points={pointsCustomTask(day, task)} expanded={expanded === "custom_" + task.id} onToggle={toggle}>
              {task.items.length === 0 && <div className="empty-note">এখনো কোনো আইটেম যোগ করা হয়নি — সেটিংস থেকে "কাস্টম টাস্ক এডিটর"-এ গিয়ে আইটেম যোগ করুন</div>}
              {task.items.map(item => (
                <div className="nafl-item" key={item.id}>
                  <span className="n-name">{item.name}</span>
                  {item.type === "checkbox" ? (
                    <Chip active={!!taskData[item.id]} color="#6B7A4F" onClick={() => setCustomItemValue(task.id, item.id, !taskData[item.id])}>
                      {taskData[item.id] ? "হয়েছে ✓" : "করুন"}
                    </Chip>
                  ) : (
                    <div className="water-counter" style={{ gap: 6 }}>
                      <button className="water-btn" onClick={() => adjustCustomCounter(task.id, item.id, -1)}><Icon name="remove" size={16} /></button>
                      <div className="water-count" style={{ fontSize: 14 }}>{taskData[item.id] || 0}</div>
                      <button className="water-btn" onClick={() => adjustCustomCounter(task.id, item.id, 1)}><Icon name="add" size={16} /></button>
                    </div>
                  )}
                </div>
              ))}
            </Card>
          );
        })}
      </div>

      {showCalendar && <CalendarModal selectedDate={date} onSelect={(d) => setDate(d)} onClose={() => setShowCalendar(false)} />}
      {showSettings && <SettingsModal darkMode={darkMode} onToggleDark={toggleDarkMode} reminderSettings={reminderSettings} onReminderChange={setReminderSettings} appPin={appPin} onSetPin={setAppPin} prayerCoords={prayerCoords} onSetPrayerCoords={setPrayerCoords} bills={bills} onAddBill={addBill} onDeleteBill={deleteBill} cardOrder={cardOrder} hiddenCards={hiddenCards} onMoveCard={moveCardOrder} onToggleCardHidden={toggleCardHidden} onShowAllCards={resetHiddenCards} customTasks={customTasks} onAddCustomTask={addCustomTask} onDeleteCustomTask={deleteCustomTask} onAddCustomItem={addCustomTaskItem} onDeleteCustomItem={deleteCustomTaskItem} onClose={() => setShowSettings(false)} />}
      {showQuickExpense && <QuickExpenseModal onClose={() => setShowQuickExpense(false)} onAdd={quickAddExpense} />}
      {showTodo && <TodoModal todos={todos} onAdd={addTodo} onToggle={toggleTodo} onDelete={deleteTodo} onClose={() => setShowTodo(false)} />}
      {showNote && <NoteModal onClose={() => setShowNote(false)} />}
      {showMoodPicker && <MoodPickerModal mood={day.mood} onSelect={setMood} onClose={() => setShowMoodPicker(false)} />}
      {showPointsGraph && <PointsGraphModal date={date} onClose={() => setShowPointsGraph(false)} />}
      {showQazaTracker && <QazaTrackerModal qazaCounts={qazaCounts} onChange={adjustQaza} onClose={() => setShowQazaTracker(false)} />}
      {showMeditationTimer && <MeditationTimerModal onClose={() => setShowMeditationTimer(false)} onComplete={completeMeditation} />}
      {showUrgeSurf && <UrgeSurfModal onClose={() => setShowUrgeSurf(false)} />}
      {showAchievements && <AchievementsModal taskStreaks={taskStreaks} onClose={() => setShowAchievements(false)} />}

      {showDiarySearch && <DiarySearchModal onClose={() => setShowDiarySearch(false)} onSelectDate={(d) => { openDiaryReader(d); setShowDiarySearch(false); }} onEditDate={(d) => { setDate(d); setExpanded("diary"); setShowDiarySearch(false); }} />}
      {showDiaryBrowser && <DiaryBrowserModal onClose={() => setShowDiaryBrowser(false)} onSelectDate={(d) => { openDiaryReader(d); setShowDiaryBrowser(false); }} onEditDate={(d) => { setDate(d); setExpanded("diary"); setShowDiaryBrowser(false); }} />}
      {showDiaryReader && <DiaryReaderModal initialDate={diaryReaderStartDate || date} onClose={() => setShowDiaryReader(false)} />}

      {showWeeklyReview && <WeeklyReviewModal date={date} onClose={() => setShowWeeklyReview(false)} />}
      {showPomodoro && (
        <StudyPromoterModal
          onClose={() => setShowPomodoro(false)}
          studyPromoter={studyPromoter}
          elapsedSeconds={getStudyPromoterElapsed()}
          todaySubjects={todaySubjects}
          onStart={startStudyPromoter}
          onPause={pauseStudyPromoter}
          onResume={resumeStudyPromoter}
          onEnd={endStudyPromoter}
        />
      )}
      {showWorkoutPromoter && (
        <WorkoutPromoterModal
          onClose={() => setShowWorkoutPromoter(false)}
          workoutPromoter={workoutPromoter}
          elapsedSeconds={getWorkoutPromoterElapsed()}
          onStart={startWorkoutPromoter}
          onPause={pauseWorkoutPromoter}
          onResume={resumeWorkoutPromoter}
          onEnd={endWorkoutPromoter}
          checklist={day.exercise.checklist}
          onIncrementSet={incrementSet}
        />
      )}
      {showReport && <ReportModal day={day} date={date} monthData={monthData} monthExpense={monthExpense} monthPlan={monthPlan} noTextPeople={noTextPeople} onClose={() => setShowReport(false)} />}
      {showMonthlyExpenseReport && <MonthlyExpenseReportModal detail={monthlyExpenseDetail} loading={monthlyExpenseLoading} onClose={() => setShowMonthlyExpenseReport(false)} />}

      <PrintReport day={day} date={date} monthData={monthData} monthExpense={monthExpense} monthPlan={monthPlan} noTextPeople={noTextPeople} />
      <PrintMonthlyExpenseReport detail={monthlyExpenseDetail} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DailyLifeManagement />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
