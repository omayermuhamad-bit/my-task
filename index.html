  },
  set(key, value) {

      catch (e) { reject(e); }
    });
  },
  list(prefix) {
    return new Promise((resolve) => {
      try {
        const keys = [];
        const p = STORAGE_PREFIX + (prefix || "");
        for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.indexOf(p) === 0) keys.push(k.slice(STORAGE_PREFIX.length));

function sleepSessionMinutes(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  if (isNaN(sh) || isNaN(sm) || isNaN(eh) || isNaN(em)) return 0;
  let startMin = sh * 60 + sm;
  let endMin = eh * 60 + em;
  if (endMin <= startMin) endMin += 24 * 60;
  return endMin - startMin;
}
function minutesToLabel(totalMin) {
  const h = Math.floor(totalMin / 60);
  const m = Math.round(totalMin % 60);
  if (h <= 0 && m <= 0) return "০ মিনিট";
  return (h > 0 ? h + " ঘণ্টা" : "") + (m ? " " + m + " মিনিট" : "");
}
function sleepDurationLabel(sleepTime, wakeTime) {
  if (!sleepTime || !wakeTime) return null;
  const mins = sleepSessionMinutes(sleepTime, wakeTime);
  if (!mins) return null;
  return minutesToLabel(mins);
}
function timeToMinutes(t) {
  if (!t) return null;
  const parts = t.split(":");
  if (parts.length < 2) return null;
  const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
// Bedtime cutoff of 12:10 AM: shift the clock so noon (12:00 PM) = 0, so evening
// times (e.g. 22:30) correctly sort "earlier" than just-after-midnight times (e.g. 00:20).
function isEarlyBedtime(sleepTime, cutoff = "00:10") {
  const sMin = timeToMinutes(sleepTime);
  const cMin = timeToMinutes(cutoff);
  if (sMin === null || cMin === null) return false;
  const shift = (m) => (m - 720 + 1440) % 1440;
  return shift(sMin) < shift(cMin);
}
function isEarlyWake(wakeTime, cutoff = "06:00") {
  const wMin = timeToMinutes(wakeTime);
  const cMin = timeToMinutes(cutoff);
  if (wMin === null || cMin === null) return false;
  return wMin < cMin;
}

}

async function computeMonthExpense(dateStr) {
  const [y, m] = dateStr.split("-").map(Number);
  const daysInM = new Date(y, m, 0).getDate();
  const totals = Object.fromEntries(ACCOUNT_CATEGORIES.map(c => [c.key, 0]));
  let grand = 0;
  for (let d = 1; d <= daysInM; d++) {
    const ds = y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const rec = await getDayRaw(ds);
    const acc = rec?.accounts;
    if (!acc) continue;
    ACCOUNT_CATEGORIES.forEach(c => {
      const v = parseFloat(acc[c.key]);
      if (!isNaN(v)) { totals[c.key] += v; grand += v; }
    });
  }
  return { totals, grand };
}

function goalsUnfinished(day) {
  const goals = [];
  const prayersDone = PRAYER_ORDER.filter(p => day.prayers[p]?.status).length;
  if (prayersDone < 5) goals.push("নামাজ");
  if (!day.zikir.durud && !day.zikir.istegfar && !day.zikir.tasbihFatemi && !(day.zikir.custom && day.zikir.custom.length > 0)) goals.push("যিকির");
  const q = day.quran;
  const quranDone = q.reading.pages || q.reading.surah || q.revision.pages || q.revision.surah || q.amoli.Mulk || q.amoli.Yasin || q.amoli.Waqiah || q.amoli.Kahf;
  if (!quranDone) goals.push("কুরআন");
  const studyDone = day.study.studied.topics || day.study.studied.hours || day.study.lectures.count || day.study.lectures.hours;
  if (!studyDone) goals.push("পড়াশোনা");
  if (!Object.values(day.exercise.checklist).some(v => v)) goals.push("ব্যায়াম");
  const sleepAuto = computeSleepAuto(day);
  const habitDone = sleepAuto.earlyRising || sleepAuto.earlySleeping || day.habit.noScreenCount || day.habit.meditation || day.habit.walkingSteps || day.habit.lustControl || (day.habit.waterGlasses > 0) || (day.habit.ghorGochano > 0);
  if (!habitDone) goals.push("অভ্যাস");
  return goals;
}

function dayCompletionScore(day, contacts, noTextPeople) {
  const ratios = [];
  ratios.push(PRAYER_ORDER.filter(p => !!day.prayers[p]?.status).length / PRAYER_ORDER.length);
  ratios.push([day.zikir.durud, day.zikir.istegfar, day.zikir.tasbihFatemi].filter(Boolean).length / 3);
  const q = day.quran;
  ratios.push([!!(q.reading.pages || q.reading.surah), !!(q.revision.pages || q.revision.surah), !!(q.amoli.Mulk || q.amoli.Yasin || q.amoli.Waqiah || q.amoli.Kahf)].filter(Boolean).length / 3);
  const s = day.study;
  ratios.push(((s.studied.topics || s.studied.hours || s.studied.topicName ? 0.5 : 0) + (s.lectures.count || s.lectures.hours || s.lectures.lectureName ? 0.5 : 0)));
  ratios.push(Math.min(1, Object.values(day.exercise.checklist).filter(v => v).length / 6));
  const walkOk = (parseFloat(day.habit.walkingSteps) || 0) >= 8000;
  const waterOk = (day.habit.waterGlasses || 0) >= 8;
  const noTextOk = (noTextPeople && noTextPeople.length > 0) ? noTextPeople.every(p => (day.habit.noTextStatus || {})[p.name] === "yes") : false;
  const sleepAutoScore = computeSleepAuto(day);
  const fixedHabits = [sleepAutoScore.earlyRising, sleepAutoScore.earlySleeping, day.habit.meditation, walkOk, day.habit.lustControl, waterOk, noTextOk, day.habit.sadaqah, !!day.habit.noScreenCount, !!day.habit.ghorGochano];
  ratios.push(fixedHabits.filter(Boolean).length / fixedHabits.length);
  ratios.push([day.diary.accomplished, day.diary.events, day.diary.thoughts].filter(Boolean).length / 3);
  ratios.push(Object.values(day.accounts).some(v => v) ? 1 : 0);
  if (contacts && contacts.length > 0) {
    const avoided = contacts.filter(n => { const e = day.texting.log[n]; return e && e.profileAvoided === true && e.textedSelf !== true; }).length;
    ratios.push(avoided / contacts.length);
  }
  const sum = ratios.reduce((a, b) => a + b, 0);
  return sum / ratios.length;
}
function isTaskFullyDone(taskId, day, contacts, noTextPeople) {
  switch (taskId) {
    case "prayer": return PRAYER_ORDER.every(p => !!day.prayers[p]?.status);
    case "zikir": return !!(day.zikir.durud && day.zikir.istegfar && day.zikir.tasbihFatemi);
    case "quran": {
      const q = day.quran;
      const reading = !!(q.reading.pages || q.reading.surah);
      const revision = !!(q.revision.pages || q.revision.surah);
      const amoli = !!(q.amoli.Mulk || q.amoli.Yasin || q.amoli.Waqiah || q.amoli.Kahf);
      return reading && revision && amoli;
    }
    case "study": {
      const s = day.study;
      return !!(s.studied.topics || s.studied.hours || s.studied.topicName) && !!(s.lectures.count || s.lectures.hours || s.lectures.lectureName);
    }
    case "exercise": {
      const setsDone = Object.values(day.exercise.checklist).filter(v => v).length;
      return setsDone >= 6;
    }
    case "habit": {
      const walkOk = (parseFloat(day.habit.walkingSteps) || 0) >= 8000;
      const waterOk = (day.habit.waterGlasses || 0) >= 8;
      const noTextOk = (noTextPeople && noTextPeople.length > 0) ? noTextPeople.every(p => (day.habit.noTextStatus || {})[p.name] === "yes") : false;
      const sleepAutoTask = computeSleepAuto(day);
      const fixed = [sleepAutoTask.earlyRising, sleepAutoTask.earlySleeping, day.habit.meditation, walkOk, day.habit.lustControl, waterOk, noTextOk, day.habit.sadaqah].every(Boolean);
      return fixed && !!day.habit.noScreenCount && !!day.habit.ghorGochano;
    }
    case "diary": return !!(day.diary.accomplished && day.diary.events && day.diary.thoughts);
    case "accounts": return Object.values(day.accounts).some(v => v);
    case "texting": {
      if (!contacts || contacts.length === 0) return false;
      return contacts.every(n => { const e = day.texting.log[n]; return e && e.profileAvoided === true && e.textedSelf !== true; });
    }
    default: return false;
  }
}
async function computeTaskStreak(taskId, fromDate, contacts, noTextPeople) {
  let streak = 0, d = fromDate;
  for (let i = 0; i < 90; i++) {
    const rec = await getDayRaw(d);
    if (!rec) break;
    const merged = mergeDay(rec);
    if (!isTaskFullyDone(taskId, merged, contacts, noTextPeople)) break;
    streak++;
    d = shiftDate(d, -1);
  }
  return streak;
}
async function computeHabitItemStreak(fromDate, isDoneFn) {
  let streak = 0, d = fromDate;
  for (let i = 0; i < 90; i++) {
    const rec = await getDayRaw(d);
    if (!rec) break;
    const merged = mergeDay(rec);
    if (!isDoneFn(merged)) break;
    streak++;
    d = shiftDate(d, -1);
  }

}

function ProgressRing({ percent, size = 34, color = "#6B7A4F" }) {

  return (
    <svg width={size} height={size} viewBox={"0 0 " + size + " " + size} style={{ flexShrink: 0 }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#FFFFFF44" strokeWidth="4" />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="4" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={offset} transform={"rotate(-90 " + size / 2 + " " + size / 2 + ")"} style={{ transition: "stroke-dashoffset .4s ease" }} />

function PinLockScreen({ correctPin, onUnlock, darkMode }) {
  const [entered, setEntered] = useState("");
  const [error, setError] = useState(false);
  const pad = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "back"];

  const handlePress = (k) => {
    setError(false);
    if (k === "back") { setEntered(e => e.slice(0, -1)); return; }
    if (k === "") return;
    if (entered.length >= 4) return;
    const next = entered + k;
    setEntered(next);
    if (next.length === 4) {
      if (next === correctPin) {
        setTimeout(() => onUnlock(), 150);
      } else {
        setError(true);
        setTimeout(() => setEntered(""), 500);
      }
    }
  };

  return (
    <div className={"dtt-root" + (darkMode ? " dark" : "")} style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
      <div style={{ textAlign: "center", width: "100%", maxWidth: 320 }}>

        <div style={{ fontSize: 12.5, color: "#8A7F68", marginBottom: 18 }}>{error ? "ভুল PIN, আবার চেষ্টা করুন" : "অ্যাপ আনলক করতে ৪-সংখ্যার PIN দিন"}</div>
        <div style={{ display: "flex", gap: 12, justifyContent: "center", marginBottom: 24 }}>
          {[0, 1, 2, 3].map(i => (
            <div key={i} style={{ width: 16, height: 16, borderRadius: "50%", border: "2px solid " + (error ? "#A14545" : "#C08A3E"), background: entered.length > i ? (error ? "#A14545" : "#C08A3E") : "transparent" }}></div>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10, maxWidth: 260, margin: "0 auto" }}>
          {pad.map((k, i) => (
            k === "" ? <div key={i}></div> :
            <button key={i} onClick={() => handlePress(k)}
              style={{ padding: "16px 0", fontSize: 18, fontWeight: 700, borderRadius: 14, border: "none", background: darkMode ? "#25302A" : "#F1E9D6", color: darkMode ? "#E7E0CC" : "#2B2A22", cursor: "pointer" }}>
              {k === "back" ? <Icon name="backspace" size={18} /> : k}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const PIE_COLORS = ["#4A6FA5", "#B5651D", "#8A6A2F", "#6B7A4F", "#7A5C8A", "#2F6B5E", "#A14545", "#8A4A5C"];
function CategoryPieChart({ totals, categories }) {
  const entries = categories.map((c, i) => ({ ...c, value: parseFloat(totals[c.key]) || 0, color: PIE_COLORS[i % PIE_COLORS.length] })).filter(e => e.value > 0);
  const sum = entries.reduce((s, e) => s + e.value, 0);
  if (sum <= 0) return <div className="empty-note" style={{ textAlign: "center" }}>এই মাসে এখনো কোনো খরচ যোগ হয়নি</div>;
  const cx = 100, cy = 100, r = 80;
  let angle = -90;
  const slices = entries.map(e => {
    const portion = e.value / sum;
    const startAngle = angle;
    const endAngle = angle + portion * 360;
    angle = endAngle;
    const large = (endAngle - startAngle) > 180 ? 1 : 0;
    const toXY = (deg) => {
      const rad = (deg * Math.PI) / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    };
    const [x1, y1] = toXY(startAngle);
    const [x2, y2] = toXY(endAngle);
    const path = portion >= 0.999
      ? "M " + cx + " " + (cy - r) + " A " + r + " " + r + " 0 1 1 " + (cx - 0.01) + " " + (cy - r) + " Z"
      : "M " + cx + " " + cy + " L " + x1 + " " + y1 + " A " + r + " " + r + " 0 " + large + " 1 " + x2 + " " + y2 + " Z";
    return { ...e, path, pct: Math.round(portion * 100) };
  });
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 16, alignItems: "center", justifyContent: "center" }}>
      <svg viewBox="0 0 200 200" width="160" height="160">
        {slices.map((s, i) => <path key={i} d={s.path} fill={s.color} stroke="#F7F1E3" strokeWidth="1.5" />)}
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {slices.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5 }}>
            <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, display: "inline-block" }}></span>
            <span>{s.label} — ৳{fmtMoney(s.value)} ({s.pct}%)</span>
          </div>
        ))}
      </div>
    </div>
  );
}

  useEffect(() => {

    setLoading(true);
    (async () => {
      const today = todayStr();
      const days = [];
      let d = today;
      for (let i = 0; i < WEEKS * 7; i++) { days.push(d); d = shiftDate(d, -1); }
      const result = {};
      for (const ds of days) {
        const rec = await getDayRaw(ds);
        if (!rec) { result[ds] = -1; continue; }
        const merged = mergeDay(rec);
        result[ds] = dayCompletionScore(merged, contacts, noTextPeople);

      if (!cancelled) { setLevels(result); setLoading(false); }
    })();
    return () => { cancelled = true; };

function isoWeekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diffDays = Math.round((target - firstThursday) / 86400000);
  const weekNo = 1 + Math.floor(diffDays / 7);
  return target.getFullYear() + "-W" + String(weekNo).padStart(2, "0");
}
function isoWeekLabel(weekKey) {
  return weekKey.replace("-W", ", সপ্তাহ ");
}
function isDayFilled(dateStr) {
  try { return window.localStorage.getItem(STORAGE_PREFIX + "day:" + dateStr) !== null; }
  catch (e) { return false; }
}

function CalendarModal({ selectedDate, onSelect, onClose }) {
  const initial = new Date(selectedDate + "T00:00:00");
  const [viewYear, setViewYear] = useState(initial.getFullYear());
  const [viewMonth, setViewMonth] = useState(initial.getMonth());

  const first = new Date(viewYear, viewMonth, 1);
  const startOffset = first.getDay();
  const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString("bn-BD", { month: "long", year: "numeric" });
  const today = todayStr();

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(d);

  const goPrevMonth = () => { const m = viewMonth - 1; if (m < 0) { setViewMonth(11); setViewYear(y => y - 1); } else setViewMonth(m); };
  const goNextMonth = () => { const m = viewMonth + 1; if (m > 11) { setViewMonth(0); setViewYear(y => y + 1); } else setViewMonth(m); };

  const dateStrFor = (d) => {
    const mm = String(viewMonth + 1).padStart(2, "0");
    const dd = String(d).padStart(2, "0");
    return viewYear + "-" + mm + "-" + dd;
  };

  return (
    <Modal onClose={onClose} width={380}>
      <div className="modal-header"><Icon name="calendar_month" size={18} color="#123A34" /><span>তারিখ বেছে নিন</span><button className="modal-close" onClick={onClose}><Icon name="close" size={18} /></button></div>
      <div className="cal-header">
        <button className="cal-nav-btn" onClick={goPrevMonth}><Icon name="chevron_left" size={18} /></button>
        <div className="cal-month">{monthLabel}</div>
        <button className="cal-nav-btn" onClick={goNextMonth}><Icon name="chevron_right" size={18} /></button>
      </div>
      <div className="cal-grid">
        {WEEKDAYS_BN.map(w => <div className="cal-wd" key={w}>{w}</div>)}
        {cells.map((d, i) => {
          if (d === null) return <div className="cal-day empty-cell" key={"e" + i}></div>;
          const ds = dateStrFor(d);
          const filled = isDayFilled(ds);
          const isToday = ds === today;
          const isSelected = ds === selectedDate;
          return (
            <div key={ds} className={"cal-day" + (isToday ? " today" : "") + (isSelected ? " selected" : "")}
              onClick={() => { onSelect(ds); onClose(); }}>
              {d}
              {filled && <div className="cal-dot"></div>}
            </div>
          );
        })}
      </div>
    </Modal>
  );
}

function exportBackup() {
  try {
    const data = {};
    for (let i = 0; i < window.localStorage.length; i++) {
      const key = window.localStorage.key(i);
      if (key && key.startsWith(STORAGE_PREFIX)) data[key] = window.localStorage.getItem(key);
    }
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "daily-life-backup-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) { alert("ব্যাকআপ নেওয়া যায়নি।"); }
}
function importBackup(file, onDone) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      Object.keys(data).forEach(k => { if (k.startsWith(STORAGE_PREFIX)) window.localStorage.setItem(k, data[k]); });
      onDone(true);
    } catch (err) { onDone(false); }
  };
  reader.onerror = () => onDone(false);
  reader.readAsText(file);
}

  const [confirmDeleteTaskId, setConfirmDeleteTaskId] = useState(null);
  const requestNotifPermission = async () => {
    if (!notifSupported) return;
    try { await Notification.requestPermission(); onReminderChange({ ...reminderSettings }); } catch (e) {}
  };
  const startSetPin = () => { setPinStep("new"); setPinDraft(""); setPinFirst(""); setPinMsg(""); };
  const submitPinDigit = (val) => {
    if (!/^\d{0,4}$/.test(val)) return;
    setPinDraft(val);
    if (val.length === 4) {
      if (pinStep === "new") { setPinFirst(val); setPinDraft(""); setPinStep("confirm"); }
      else if (pinStep === "confirm") {
        if (val === pinFirst) { onSetPin(val); setPinStep(null); setPinMsg("PIN সেট হয়েছে ✓"); setTimeout(() => setPinMsg(""), 3000); }
        else { setPinMsg("PIN মিলেনি, আবার চেষ্টা করুন"); setPinStep("new"); setPinDraft(""); setPinFirst(""); }
      }
    }
  };
  return (
    <Modal onClose={onClose} width={380}>
      <div className="modal-header"><Icon name="settings" size={18} color="#123A34" /><span>সেটিংস</span><button className="modal-close" onClick={onClose}><Icon name="close" size={18} /></button></div>
      <div className="settings-row">
        <span>ডার্ক মোড</span>
        <button className={"dark-toggle" + (darkMode ? " on" : "")} onClick={onToggleDark}><span className="dark-toggle-knob"></span></button>
      </div>

      <div className="settings-row" style={{ cursor: "pointer" }} onClick={() => setShowCardArrange(v => !v)}>
        <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Icon name="dashboard_customize" size={17} color="#123A34" />
          হোমপেজ কার্ড সাজান
          {hiddenCards.length > 0 && <span style={{ fontSize: 11, color: "#8A7F68" }}>({hiddenCards.length}টি লুকানো)</span>}
        </span>
        <Icon name={showCardArrange ? "expand_less" : "expand_more"} size={18} />
      </div>
      {showCardArrange && (
        <div style={{ marginBottom: 8 }}>
          {cardOrder && cardOrder.map((id, i) => (
            <div key={id} className="settings-row" style={{ opacity: hiddenCards.includes(id) ? 0.5 : 1, paddingLeft: 12 }}>
              <span>{SUMMARY_CARD_LABELS[id]}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                <button className="icon-btn ghost" disabled={i === 0} style={i === 0 ? { opacity: 0.3 } : {}} onClick={() => onMoveCard(id, -1)}><Icon name="arrow_upward" size={15} /></button>
                <button className="icon-btn ghost" disabled={i === cardOrder.length - 1} style={i === cardOrder.length - 1 ? { opacity: 0.3 } : {}} onClick={() => onMoveCard(id, 1)}><Icon name="arrow_downward" size={15} /></button>
                <button className="icon-btn ghost" onClick={() => onToggleCardHidden(id)} title={hiddenCards.includes(id) ? "আবার দেখাতে ক্লিক করুন" : "লুকাতে ক্লিক করুন"}><Icon name={hiddenCards.includes(id) ? "visibility_off" : "visibility"} size={15} /></button>
              </div>
            </div>
          ))}
          {hiddenCards.length > 0 && (
            <div className="settings-row" style={{ paddingLeft: 12 }}>
              <span style={{ color: "#8A7F68", fontSize: 12 }}>সব কার্ড আবার দেখাতে চান?</span>
              <button className="icon-btn ghost" onClick={onShowAllCards}><Icon name="visibility" size={15} /></button>
            </div>
          )}
        </div>
      )}

      <div className="settings-row" style={{ cursor: "pointer" }} onClick={() => setShowCustomEditor(v => !v)}>
        <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Icon name="add_box" size={17} color="#123A34" />
          কাস্টম টাস্ক এডিটর
          {customTasks.length > 0 && <span style={{ fontSize: 11, color: "#8A7F68" }}>({customTasks.length}টি)</span>}
        </span>
        <Icon name={showCustomEditor ? "expand_less" : "expand_more"} size={18} />
      </div>
      {showCustomEditor && (
        <div style={{ marginBottom: 8, paddingLeft: 12 }}>
          <div className="empty-note" style={{ marginBottom: 10 }}>
            এখানে নিজের ইচ্ছামতো একদম নতুন টাস্ক/কার্ড বানাতে পারবেন — সেটা হোমপেজে আলাদা কার্ড হিসেবে দেখাবে। তার ভেতরে চেকবক্স (হ্যাঁ/না) বা কাউন্টার (কতবার) ধরনের আইটেম যোগ করে প্রতিটার জন্য পয়েন্ট ঠিক করে দিতে পারবেন।
          </div>
          {customTasks.length === 0 && <div className="empty-note">এখনো কোনো কাস্টম টাস্ক যোগ করা হয়নি</div>}
          {customTasks.map(task => (
            <div key={task.id} className="subblock" style={{ marginBottom: 12 }}>
              <div className="subblock-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span>{task.name}</span>
                {confirmDeleteTaskId === task.id ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontSize: 11, color: "#A14545" }}>মুছবেন?</span>
                    <button className="icon-btn ghost" style={{ color: "#A14545" }} onClick={() => { onDeleteCustomTask(task.id); setConfirmDeleteTaskId(null); }} title="নিশ্চিত — মুছে ফেলুন"><Icon name="check" size={15} /></button>
                    <button className="icon-btn ghost" onClick={() => setConfirmDeleteTaskId(null)} title="বাতিল"><Icon name="close" size={15} /></button>
                  </div>
                ) : (
                  <button className="icon-btn ghost" onClick={() => setConfirmDeleteTaskId(task.id)} title="পুরো টাস্কটি মুছে ফেলুন"><Icon name="delete" size={15} /></button>
                )}
              </div>
              {task.items.length === 0 && <div className="empty-note">এখনো কোনো আইটেম নেই — নিচে যোগ করুন</div>}
              {task.items.map(item => (
                <div className="nafl-item" key={item.id}>
                  <span className="n-name">{item.name} <span style={{ fontSize: 11, color: "#8A7F68" }}>({item.type === "checkbox" ? "চেকবক্স" : "কাউন্টার"} · {item.points >= 0 ? "+" : ""}{item.points}/প্রতি)</span></span>
                  <button className="icon-btn ghost" onClick={() => onDeleteCustomItem(task.id, item.id)}><Icon name="delete" size={15} /></button>

          <div className="add-row">
            <input placeholder="নতুন টাস্কের নাম (যেমন: বাগান করা)" value={newTaskName} onChange={e => setNewTaskName(e.target.value)} onKeyDown={e => e.key === "Enter" && (onAddCustomTask(newTaskName), setNewTaskName(""))} />
            <button className="icon-btn" onClick={() => { onAddCustomTask(newTaskName); setNewTaskName(""); }}><Icon name="add" size={18} /></button>
          </div>
        </div>
      )}

      <div className="section-label">আর্লি রাইজিং / আর্লি স্লিপিং অ্যালার্ট</div>
      <div className="settings-row">
        <span>অ্যালার্ট চালু রাখুন</span>
        <button
          className={"dark-toggle" + (reminderSettings.enabled ? " on" : "")}
          onClick={async () => {
            const next = { ...reminderSettings, enabled: !reminderSettings.enabled };
            if (next.enabled && notifSupported && Notification.permission === "default") {
              try { await Notification.requestPermission(); } catch (e) {}
            }
            onReminderChange(next);
          }}
        ><span className="dark-toggle-knob"></span></button>
      </div>
      {reminderSettings.enabled && (
        <>
          <div className="field-row">
            <div className="field"><label>উঠার সময় (আর্লি রাইজিং)</label>
              <input type="time" value={reminderSettings.wakeTime} onChange={e => onReminderChange({ ...reminderSettings, wakeTime: e.target.value })} />
            </div>
            <div className="field"><label>ঘুমানোর সময় (আর্লি স্লিপিং)</label>
              <input type="time" value={reminderSettings.sleepTime} onChange={e => onReminderChange({ ...reminderSettings, sleepTime: e.target.value })} />
            </div>
          </div>
          <div className="field" style={{ marginBottom: 10 }}>
            <label>দৈনিক টাস্ক আপডেট রিমাইন্ডার</label>
            <input type="time" value={reminderSettings.taskUpdateTime} onChange={e => onReminderChange({ ...reminderSettings, taskUpdateTime: e.target.value })} />
          </div>
          <div className="settings-row">
            <span>পানি খাওয়ার রিমাইন্ডার (প্রতি ২ ঘণ্টা)</span>
            <button
              className={"dark-toggle" + (reminderSettings.waterReminderOn ? " on" : "")}
              onClick={() => onReminderChange({ ...reminderSettings, waterReminderOn: !reminderSettings.waterReminderOn })}
            ><span className="dark-toggle-knob"></span></button>
          </div>
          {reminderSettings.waterReminderOn && (
            <div className="empty-note" style={{ padding: "0 0 6px" }}>সকাল ৯টা থেকে রাত ৯টা পর্যন্ত প্রতি ২ ঘণ্টায় চেক হবে — সেই সময় পর্যন্ত প্রত্যাশিত গ্লাসের চেয়ে কম হলে নোটিফিকেশন আসবে।</div>
          )}

          <div className="settings-row">
            <span>নামাজের ওয়াক্ত-ভিত্তিক অ্যালার্ট</span>
            <button
              className={"dark-toggle" + (reminderSettings.prayerAlertsOn ? " on" : "")}
              onClick={() => onReminderChange({ ...reminderSettings, prayerAlertsOn: !reminderSettings.prayerAlertsOn })}
            ><span className="dark-toggle-knob"></span></button>
          </div>
          {reminderSettings.prayerAlertsOn && (
            <>
              <button className="btn-ghost" style={{ width: "100%", justifyContent: "center", marginBottom: 6 }} onClick={requestLocation} disabled={locLoading}>
                <Icon name="location_on" size={15} /> {locLoading ? "লোকেশন নেওয়া হচ্ছে..." : prayerCoords ? "লোকেশন আপডেট করুন" : "লোকেশন সেট করুন"}
              </button>
              {locMsg && <div className="goal-ok" style={{ marginBottom: 6 }}>{locMsg}</div>}
              {todayPrayerTimes && (
                <div className="subblock" style={{ fontSize: 12.5, display: "flex", flexWrap: "wrap", gap: "4px 14px", justifyContent: "center" }}>
                  {PRAYER_ORDER.map(p => <span key={p}><b>{PRAYER_BN[p]}</b>: {todayPrayerTimes[p] || "—"}</span>)}
                </div>
              )}
              <div className="empty-note" style={{ padding: "0 0 6px" }}>
                এই সময়গুলো আনুমানিক জ্যোতির্বিজ্ঞান হিসাব থেকে বের করা (GPS লোকেশন লাগবে) — স্থানীয় মসজিদ/ইসলামিক ক্যালেন্ডারের সাথে ১-২ মিনিট পার্থক্য হতে পারে, তাই এটাকে নির্দেশক হিসেবে ব্যবহার করুন।
              </div>
            </>
          )}
          {notifSupported && notifPermission !== "granted" && (
            <button className="btn-ghost" style={{ width: "100%", justifyContent: "center", marginBottom: 6 }} onClick={requestNotifPermission}>
              <Icon name="notifications" size={15} /> নোটিফিকেশন পারমিশন দিন
            </button>
          )}

          <div className="section-label">রিকারিং বিল রিমাইন্ডার</div>
          <div className="settings-row">
            <span>বিল রিমাইন্ডার চালু রাখুন</span>
            <button
              className={"dark-toggle" + (reminderSettings.billsOn ? " on" : "")}
              onClick={() => onReminderChange({ ...reminderSettings, billsOn: !reminderSettings.billsOn })}
            ><span className="dark-toggle-knob"></span></button>
          </div>
          {reminderSettings.billsOn && (
            <>
              <div className="field-row" style={{ marginBottom: 8 }}>
                <div className="field"><label>বিলের নাম</label><input value={billDraft.name} onChange={e => setBillDraft({ ...billDraft, name: e.target.value })} placeholder="যেমন বাসা ভাড়া" /></div>
                <div className="field"><label>মাসের কততারিখে</label><input type="number" min="1" max="31" value={billDraft.dayOfMonth} onChange={e => setBillDraft({ ...billDraft, dayOfMonth: e.target.value })} placeholder="১-৩১" /></div>
              </div>
              <div className="field" style={{ marginBottom: 8 }}>
                <label>টাকা (ঐচ্ছিক)</label>
                <input type="number" min="0" value={billDraft.amount} onChange={e => setBillDraft({ ...billDraft, amount: e.target.value })} placeholder="৳" />
              </div>
              <button
                className="btn-primary" style={{ width: "100%", justifyContent: "center", marginBottom: 10 }}
                onClick={() => {
                  if (!billDraft.name.trim() || !billDraft.dayOfMonth) return;
                  onAddBill(billDraft.name, billDraft.amount, billDraft.dayOfMonth);
                  setBillDraft({ name: "", amount: "", dayOfMonth: "" });
                }}
              ><Icon name="add" size={15} /> বিল যোগ করুন</button>
              {bills.length > 0 ? (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
                  {bills.map(b => (
                    <div key={b.id} className="subblock" style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <Icon name="event_repeat" size={16} color="#8A7F68" />
                      <div style={{ flex: 1, fontSize: 12.5 }}>
                        <b>{b.name}</b> — প্রতি মাসের {b.dayOfMonth} তারিখ{b.amount ? " · ৳" + fmtMoney(b.amount) : ""}
                      </div>
                      <button className="icon-btn ghost" onClick={() => onDeleteBill(b.id)}><Icon name="close" size={15} /></button>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="empty-note" style={{ marginBottom: 8 }}>এখনো কোনো বিল যোগ করা হয়নি</div>
              )}
            </>
          )}
          {notifSupported && notifPermission === "granted" && (
            <button
              className="btn-ghost"
              style={{ width: "100%", justifyContent: "center", marginBottom: 6 }}
              onClick={() => {
                const fallback = () => { try { new Notification("টেস্ট নোটিফিকেশন ✅", { body: "এটা দেখতে পেলে নোটিফিকেশন ঠিকমতো কাজ করছে।", icon: "icon-192.png" }); } catch (e) {} };
                if (navigator.serviceWorker) {
                  Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 1500))])
                    .then(reg => { if (reg && reg.showNotification) reg.showNotification("টেস্ট নোটিফিকেশন ✅", { body: "এটা দেখতে পেলে নোটিফিকেশন ঠিকমতো কাজ করছে।", icon: "icon-192.png" }); else fallback(); })
                    .catch(fallback);
                } else fallback();
              }}
            >
              <Icon name="notifications_active" size={15} /> টেস্ট নোটিফিকেশন পাঠান
            </button>
          )}
          <div className="empty-note" style={{ padding: "4px 0 0" }}>
            অ্যাপ/ট্যাব খোলা বা background-এ থাকা অবস্থায় নির্ধারিত সময়ে নোটিফিকেশন আসবে। ব্রাউজার/অ্যাপ সম্পূর্ণ বন্ধ থাকলে অ্যালার্ট আসবে না।
          </div>
        </>
      )}

      <div className="section-label">অ্যাপ PIN লক</div>
      <div className="settings-row">
        <span>{appPin ? "PIN চালু আছে" : "PIN বন্ধ আছে"}</span>
        {appPin ? (
          <button className="btn-ghost" onClick={() => { if (window.confirm("PIN সরিয়ে ফেলতে চান?")) { onSetPin(""); setPinMsg("PIN সরানো হয়েছে"); setTimeout(() => setPinMsg(""), 3000); } }}>সরিয়ে ফেলুন</button>
        ) : (
          <button className="btn-ghost" onClick={startSetPin}>PIN সেট করুন</button>
        )}
      </div>
      {appPin && !pinStep && (
        <button className="btn-ghost" style={{ marginBottom: 6 }} onClick={startSetPin}>PIN পরিবর্তন করুন</button>
      )}
      {pinStep && (
        <div className="field" style={{ marginBottom: 8 }}>
          <label>{pinStep === "new" ? "নতুন ৪-সংখ্যার PIN দিন" : "PIN আবার লিখে নিশ্চিত করুন"}</label>
          <input type="password" inputMode="numeric" maxLength={4} value={pinDraft} onChange={e => submitPinDigit(e.target.value)} placeholder="০০০০" />
        </div>
      )}
      {pinMsg && <div className="goal-ok" style={{ marginBottom: 8 }}>{pinMsg}</div>}
      {appPin && <div className="empty-note" style={{ padding: "0 0 6px" }}>PIN ভুলে গেলে ব্রাউজারের সাইট ডেটা মুছে দিতে হবে (এতে অন্য সব ডেটাও মুছে যাবে), তাই আগে ব্যাকআপ নিয়ে রাখুন।</div>}

      <div className="section-label">ডেটা ব্যাকআপ</div>
      <button className="btn-primary" style={{ width: "100%", justifyContent: "center", marginBottom: 10 }} onClick={exportBackup}><Icon name="download" size={15} /> ব্যাকআপ নিন (ডাউনলোড)</button>
      <button className="btn-ghost" style={{ width: "100%", justifyContent: "center" }} onClick={() => fileInputRef.current.click()}><Icon name="upload" size={15} /> ব্যাকআপ ফিরিয়ে আনুন</button>
      <input type="file" accept="application/json" ref={fileInputRef} style={{ display: "none" }}
        onChange={e => {
          if (!e.target.files[0]) return;
          importBackup(e.target.files[0], (ok) => {
            if (ok) { alert("ব্যাকআপ ফিরিয়ে আনা হয়েছে। অ্যাপ রিলোড হচ্ছে..."); window.location.reload(); }
            else alert("ফাইলটি সঠিক নয়।");
          });
        }} />
      <div className="empty-note" style={{ padding: "10px 0 0" }}>Netlify-তে নতুন আপডেট দেওয়ার আগে ব্যাকআপ নিয়ে রাখা নিরাপদ।</div>
    </Modal>
  );
}

function QuickExpenseModal({ onClose, onAdd }) {
  const [cat, setCat] = useState(null);
  const [amount, setAmount] = useState("");
  return (
    <Modal onClose={onClose} width={360}>
      <div className="modal-header"><Icon name="bolt" size={18} color="#2F6B5E" /><span>দ্রুত খরচ যোগ করুন</span><button className="modal-close" onClick={onClose}><Icon name="close" size={18} /></button></div>
      <div className="modal-q">কোন খাতে?</div>
      <div className="chip-grid">
        {ACCOUNT_CATEGORIES.map(c => <Chip key={c.key} active={cat === c.key} color="#2F6B5E" onClick={() => setCat(c.key)}>{c.label}</Chip>)}
      </div>
      <div className="modal-q" style={{ marginTop: 12 }}>কত টাকা?</div>
      <input className="modal-input" type="number" min="0" value={amount} onChange={e => setAmount(e.target.value)} placeholder="যেমন ১০০" autoFocus />
      <div className="modal-actions" style={{ justifyContent: "flex-end" }}>
        <button className="btn-primary" style={{ background: "#2F6B5E" }} disabled={!cat || !amount} onClick={() => { onAdd(cat, amount); onClose(); }}>যোগ করুন</button>
      </div>
    </Modal>
  );
}

/* ---------------- reusable report content (used both on-screen and for printing) ---------------- */
function ReportContent({ day, date, monthData, monthExpense, monthPlan, noTextPeople }) {
  const statusLabel = Object.fromEntries(PRAYER_STATUS.map(s => [s.key, s.label]));
  const q = day.quran;
  const textLog = Object.entries(day.texting.log);
  const todayExpTotal = ACCOUNT_CATEGORIES.reduce((s, c) => s + (parseFloat(day.accounts[c.key]) || 0), 0);

function DailyLifeManagement() {
  const [date, setDate] = useState(todayStr());
  const todayRef = useRef(todayStr());
  const [darkMode, setDarkMode] = useState(() => {
    try { return window.localStorage.getItem(STORAGE_PREFIX + "darkMode") === "1"; } catch (e) { return false; }
  });
  const [appPin, setAppPinState] = useState(() => {
    try { return window.localStorage.getItem(STORAGE_PREFIX + "pin") || ""; } catch (e) { return ""; }
  });
  const [pinUnlocked, setPinUnlocked] = useState(false);
  const setAppPin = (pin) => {
    setAppPinState(pin);
    try {
      if (pin) window.localStorage.setItem(STORAGE_PREFIX + "pin", pin);
      else window.localStorage.removeItem(STORAGE_PREFIX + "pin");
    } catch (e) {}
  };
  const [prayerCoords, setPrayerCoordsState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "prayerCoords");
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  });
  const setPrayerCoords = (coords) => {
    setPrayerCoordsState(coords);
    try {
      if (coords) window.localStorage.setItem(STORAGE_PREFIX + "prayerCoords", JSON.stringify(coords));
      else window.localStorage.removeItem(STORAGE_PREFIX + "prayerCoords");
    } catch (e) {}
  };
  const toggleDarkMode = () => {
    setDarkMode(prev => {
      const next = !prev;
      try { window.localStorage.setItem(STORAGE_PREFIX + "darkMode", next ? "1" : "0"); } catch (e) {}
      return next;
    });
  };

  const DEFAULT_CARD_ORDER = ["prayer", "zikir", "quran", "study", "exercise", "habit", "texting", "diary", "accounts", "plan"];
  const [cardOrder, setCardOrderState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "cardOrder");
      const saved = raw ? JSON.parse(raw) : null;
      if (!Array.isArray(saved)) return DEFAULT_CARD_ORDER;
      const merged = saved.filter(id => DEFAULT_CARD_ORDER.includes(id));
      DEFAULT_CARD_ORDER.forEach(id => { if (!merged.includes(id)) merged.push(id); });
      return merged;
    } catch (e) { return DEFAULT_CARD_ORDER; }
  });
  const [hiddenCards, setHiddenCardsState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "hiddenCards");
      const saved = raw ? JSON.parse(raw) : null;
      return Array.isArray(saved) ? saved : [];
    } catch (e) { return []; }
  });
  const setCardOrder = (next) => {
    setCardOrderState(next);
    try { window.localStorage.setItem(STORAGE_PREFIX + "cardOrder", JSON.stringify(next)); } catch (e) {}
  };
  const setHiddenCards = (next) => {
    setHiddenCardsState(next);
    try { window.localStorage.setItem(STORAGE_PREFIX + "hiddenCards", JSON.stringify(next)); } catch (e) {}
  };
  const moveCardOrder = (id, dir) => {
    const idx = cardOrder.indexOf(id);
    const swapWith = idx + dir;
    if (idx < 0 || swapWith < 0 || swapWith >= cardOrder.length) return;
    const next = [...cardOrder];
    [next[idx], next[swapWith]] = [next[swapWith], next[idx]];
    setCardOrder(next);
  };
  const toggleCardHidden = (id) => {
    setHiddenCards(hiddenCards.includes(id) ? hiddenCards.filter(x => x !== id) : [...hiddenCards, id]);
  };
  const resetHiddenCards = () => setHiddenCards([]);

  const [hijriOffsetDays, setHijriOffsetDaysState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "hijriOffset");
      return raw ? parseInt(raw) || 0 : 0;
    } catch (e) { return 0; }
  });
  const setHijriOffsetDays = (value) => {
    setHijriOffsetDaysState(value);
    try { window.localStorage.setItem(STORAGE_PREFIX + "hijriOffset", String(value)); } catch (e) {}
  };

  const [reminderSettings, setReminderSettingsState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + "reminders");
      const defaults = { enabled: false, wakeTime: "05:00", sleepTime: "23:30", taskUpdateTime: "23:30", waterReminderOn: false, prayerAlertsOn: false };
      return raw ? { ...defaults, ...JSON.parse(raw) } : defaults;
    } catch (e) { return { enabled: false, wakeTime: "05:00", sleepTime: "23:30", taskUpdateTime: "23:30", waterReminderOn: false, prayerAlertsOn: false }; }
  });

  const adjustGhorGochanoMiss = (delta) => updateDay(prev => ({ ...prev, habit: { ...prev.habit, ghorGochanoMiss: Math.max(0, (parseInt(prev.habit.ghorGochanoMiss) || 0) + delta) } }));
  const setWalkingSteps = (value) => updateDay(prev => ({ ...prev, habit: { ...prev.habit, walkingSteps: value } }));
  const adjustWalkingSteps = (delta) => updateDay(prev => ({ ...prev, habit: { ...prev.habit, walkingSteps: Math.max(0, (parseFloat(prev.habit.walkingSteps) || 0) + delta) } }));

  const [noScreenAutoMsg, setNoScreenAutoMsg] = useState("");
  const NO_SCREEN_STORAGE_KEY = STORAGE_PREFIX + "noScreenHiddenAt";
  useEffect(() => {
    const NO_SCREEN_MIN_MS = 30 * 60 * 1000;
    const WINDOW_START_HOUR = 10;

    const processPendingGap = () => {
      let hiddenAt = null;
      try { hiddenAt = window.localStorage.getItem(NO_SCREEN_STORAGE_KEY); } catch (e) {}
      if (!hiddenAt) return;
      try { window.localStorage.removeItem(NO_SCREEN_STORAGE_KEY); } catch (e) {}
      hiddenAt = parseInt(hiddenAt, 10);
      if (!hiddenAt) return;
      const elapsed = Date.now() - hiddenAt;
      if (elapsed < NO_SCREEN_MIN_MS) return;
      const hiddenAtDate = new Date(hiddenAt);
      const hour = hiddenAtDate.getHours();
      const inWindow = hour >= WINDOW_START_HOUR;
      const hiddenAtDay = todayStr(hiddenAtDate);
      if (inWindow && hiddenAtDay === date) {
        adjustNoScreenCount(1);
        setNoScreenAutoMsg((Math.round(elapsed / 60000)) + " মিনিট স্ক্রিন থেকে দূরে ছিলেন — অটো +১ যোগ হয়েছে");
        setTimeout(() => setNoScreenAutoMsg(""), 6000);
      }
    };

    const markHidden = () => {
      try {
        if (!window.localStorage.getItem(NO_SCREEN_STORAGE_KEY)) {
          window.localStorage.setItem(NO_SCREEN_STORAGE_KEY, String(Date.now()));
        }
      } catch (e) {}
    };

    const handleVisibility = () => {
      if (document.hidden) { markHidden(); } else { processPendingGap(); }
    };

    // app হয়তো পুরোপুরি বন্ধ হয়ে আবার খোলা হয়েছে — mount হওয়ার সাথে সাথেই আগের pending gap হিসাব করি
    processPendingGap();
    document.addEventListener("visibilitychange", handleVisibility);
    window.addEventListener("pagehide", markHidden);
    window.addEventListener("blur", markHidden);
    return () => {
      document.removeEventListener("visibilitychange", handleVisibility);
      window.removeEventListener("pagehide", markHidden);
      window.removeEventListener("blur", markHidden);
    };
  }, [date]);


  useEffect(() => {
    if (!pedometerActive) return;
    let lastMag = 0, lastStepTime = 0, warmedUp = false;
    const STEP_THRESHOLD = 1.15;
    const MIN_STEP_INTERVAL = 280;
    const handleMotion = (e) => {
      const acc = e.accelerationIncludingGravity;
      if (!acc || acc.x === null || acc.x === undefined) return;
      const mag = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);
      if (!warmedUp) { lastMag = mag; warmedUp = true; return; }
      const delta = mag - lastMag;
      lastMag = mag;
      const now = Date.now();
      if (delta > STEP_THRESHOLD && (now - lastStepTime) > MIN_STEP_INTERVAL) {
        lastStepTime = now;
        adjustWalkingSteps(1);
      }
    };
    window.addEventListener("devicemotion", handleMotion);
    return () => window.removeEventListener("devicemotion", handleMotion);
  }, [pedometerActive, date]);

  const togglePedometer = async () => {
    if (pedometerActive) { setPedometerActive(false); return; }

      return;
    }
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      try {
        const res = await DeviceMotionEvent.requestPermission();
        if (res !== "granted") { setPedometerError("মোশন সেন্সর অনুমতি দেওয়া হয়নি।"); return; }
      } catch (e) { setPedometerError("সেন্সর অ্যাক্সেস করা গেল না, হাতে লিখুন।"); return; }

    pedometerDateRef.current = date;
    setPedometerActive(true);
  };

  useEffect(() => {

  const simpleHabitItems = [

              <div className="nafl-item" key={p.id}>

                <span className="n-rakahs">{p.date || ""}</span>

          const taskData = (day.customData || {})[task.id] || {};
          return (
            <Card key={task.id} id={"custom_" + task.id} iconName={task.icon || "star"} title={task.name} subtitle="কাস্টম টাস্ক" accent="#7A5C4A" points={pointsCustomTask(day, task)} expanded={expanded === "custom_" + task.id} onToggle={toggle}>
              {task.items.length === 0 && <div className="empty-note">এখনো কোনো আইটেম যোগ করা হয়নি — সেটিংস থেকে "কাস্টম টাস্ক এডিটর"-এ গিয়ে আইটেম যোগ করুন</div>}
              {task.items.map(item => (
                <div className="nafl-item" key={item.id}>
                  <span className="n-name">{item.name}</span>
                  {item.type === "checkbox" ? (
                    <Chip active={!!taskData[item.id]} color="#6B7A4F" onClick={() => setCustomItemValue(task.id, item.id, !taskData[item.id])}>
                      {taskData[item.id] ? "হয়েছে ✓" : "করুন"}

                    <div className="water-counter" style={{ gap: 6 }}>
                      <button className="water-btn" onClick={() => adjustCustomCounter(task.id, item.id, -1)}><Icon name="remove" size={16} /></button>

                      <button className="water-btn" onClick={() => adjustCustomCounter(task.id, item.id, 1)}><Icon name="add" size={16} /></button>

                  )}
                </div>
              ))}
            </Card>
          );
        })}
      </div>

      {showSettings && <SettingsModal darkMode={darkMode} onToggleDark={toggleDarkMode} reminderSettings={reminderSettings} onReminderChange={setReminderSettings} appPin={appPin} onSetPin={setAppPin} prayerCoords={prayerCoords} onSetPrayerCoords={setPrayerCoords} bills={bills} onAddBill={addBill} onDeleteBill={deleteBill} cardOrder={cardOrder} hiddenCards={hiddenCards} onMoveCard={moveCardOrder} onToggleCardHidden={toggleCardHidden} onShowAllCards={resetHiddenCards} customTasks={customTasks} onAddCustomTask={addCustomTask} onDeleteCustomTask={deleteCustomTask} onAddCustomItem={addCustomTaskItem} onDeleteCustomItem={deleteCustomTaskItem} onClose={() => setShowSettings(false)} />}
      {showQuickExpense && <QuickExpenseModal onClose={() => setShowQuickExpense(false)} onAdd={quickAddExpense} />}
      {showQazaTracker && <QazaTrackerModal qazaCounts={qazaCounts} onChange={adjustQaza} onClose={() => setShowQazaTracker(false)} />}
      {showMeditationTimer && <MeditationTimerModal onClose={() => setShowMeditationTimer(false)} onComplete={completeMeditation} />}
      {showUrgeSurf && <UrgeSurfModal onClose={() => setShowUrgeSurf(false)} />}
      {showAchievements && <AchievementsModal taskStreaks={taskStreaks} onClose={() => setShowAchievements(false)} />}

      {showDiarySearch && <DiarySearchModal onClose={() => setShowDiarySearch(false)} onSelectDate={(d) => { setDate(d); setExpanded("diary"); setShowDiarySearch(false); }} />}

      {showWeeklyReview && <WeeklyReviewModal date={date} onClose={() => setShowWeeklyReview(false)} />}
      {showPomodoro && <PomodoroModal onClose={() => setShowPomodoro(false)} onComplete={completePomodoro} />}
      {showReport && <ReportModal day={day} date={date} monthData={monthData} monthExpense={monthExpense} monthPlan={monthPlan} noTextPeople={noTextPeople} onClose={() => setShowReport(false)} />}

      <PrintReport day={day} date={date} monthData={monthData} monthExpense={monthExpense} monthPlan={monthPlan} noTextPeople={noTextPeople} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DailyLifeManagement />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
